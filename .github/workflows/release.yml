name: Release

on:
  push:
    tags: ['v*']
  # A manual run rehearses the build: the files are built, tested and kept as
  # workflow artifacts, and nothing is published.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
            ext: ''
          - os: windows-latest
            asset: windows-x86_64
            ext: '.exe'
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      asset: ${{ matrix.asset }}
      ext: ${{ matrix.ext }}

  # macOS is built apart from the others: GitHub's macOS machines are not
  # always available, and a release must not wait for them. Its files are
  # added to the release when they are built; if this job is cancelled for
  # want of a machine, "Re-run failed jobs" on the run adds them later.
  build-macos:
    uses: ./.github/workflows/build.yml
    with:
      os: macos-15
      asset: macos-arm64

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # The Linux and Windows files; the macOS files may not exist yet.
          pattern: '*-x86_64'
          path: release-files
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "The executables are unsigned, so macOS and Windows may warn on first run. Run chmod +x before first use on the Linux files and on the macOS command-line file (optar-...-macos-arm64), not on the zipped application. On macOS, unzip optar-gui and try to open it; if macOS refuses, open System Settings, Privacy & Security, and choose Open Anyway (on older macOS versions, right-click the application and choose Open). The macOS files are added to this release when their build finishes, which can be later than the others." \
            release-files/*

  publish-macos:
    needs: [publish, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-macos-arm64'
          path: release-files
          merge-multiple: true
      - name: Add the macOS files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-files/*
