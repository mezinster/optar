name: Release

on:
  push:
    tags: ['v*']
  # A manual run rehearses the build: the files are built, tested and kept as
  # workflow artifacts, and nothing is published.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
            ext: ''
          - os: windows-latest
            asset: windows-x86_64
            ext: '.exe'
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      asset: ${{ matrix.asset }}
      ext: ${{ matrix.ext }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # The Linux and Windows files; the macOS workflow adds its own.
          pattern: '*-x86_64'
          path: release-files
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "The executables are unsigned, so macOS and Windows may warn on first run. Run chmod +x before first use on the Linux files and on the macOS command-line file (optar-...-macos-arm64), not on the zipped application. On macOS, unzip optar-gui and try to open it; if macOS refuses, open System Settings, Privacy & Security, and choose Open Anyway (on older macOS versions, right-click the application and choose Open). The macOS files are added to this release by a separate build, which can finish hours or days later than the others." \
            release-files/*

  # macOS is built by its own workflow: GitHub's macOS machines are often
  # unavailable, and the release must not wait for them. That workflow adds
  # the macOS files to this release when it has built and tested them. If it
  # never gets a machine, start it again by hand with this tag.
  start-macos:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the macOS workflow for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run macos.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" -f tag="$GITHUB_REF_NAME"
