name: CI

on:
  # A branch with an open pull request is tested once, by the pull request;
  # pushes are tested only on master, after a merge.
  push:
    branches: [master]
  pull_request:

# A newer commit on the same pull request (or on master) replaces the run in
# progress, so superseded runs do not hold the scarce macOS machines.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -e '.[dev]'
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # Ghostscript checks run in the ghostscript job on Linux, slow tests in
      # the slow jobs, the desktop application's tests in the gui job.
      - run: pytest -q -m "not gs and not slow and not gui"

  # The Ghostscript checks of the PDF output.
  ghostscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: pip install -e '.[dev]'
      - name: Run Ghostscript tests
        run: |
          set -o pipefail
          # tests/gui needs PySide6, which this job does not install. Ignoring
          # the folder keeps its collection skips out of the log checked below.
          pytest -q -rs -m gs --ignore=tests/gui | tee pytest.log
      - name: Fail on skipped tests other than tests/scans
        run: |
          if grep '^SKIPPED' pytest.log | grep -v 'tests/scans'; then
            echo "These gs tests were skipped (only tests/scans may skip)." >&2
            exit 1
          fi

  # The slow tests run as four jobs side by side; the three big files also use
  # every core of their machine.
  slow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: claims
            args: -n auto tests/unit/test_claims.py
          - name: identify
            args: -n auto tests/unit/test_identify.py
          - name: label
            args: -n auto tests/unit/test_label.py
          # The rest measure time and memory, so they run one at a time.
          - name: rest
            args: >-
              --ignore=tests/unit/test_claims.py
              --ignore=tests/unit/test_identify.py
              --ignore=tests/unit/test_label.py
    name: slow (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -e '.[dev]'
      - name: Run slow tests
        run: |
          set -o pipefail
          pytest -q -rs -m "slow and not gs and not gui" --ignore=tests/gui \
            ${{ matrix.args }} | tee pytest.log
      - name: Fail on skipped tests other than tests/scans
        run: |
          if grep '^SKIPPED' pytest.log | grep -v 'tests/scans'; then
            echo "These slow tests were skipped (only tests/scans may skip)." >&2
            exit 1
          fi

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e '.[dev,gui-dev]'
      # -m gui replaces the default "not slow", so the slow GUI test runs here too.
      - run: pytest -q -m gui
