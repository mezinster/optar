name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libpng-dev ghostscript
      - run: pip install -e '.[dev]'
      - name: Run oracle, Ghostscript and slow tests
        run: |
          set -o pipefail
          pytest -q -rs -m "oracle or gs or slow" | tee pytest.log
      - name: Fail on skipped tests other than tests/scans
        run: |
          if grep '^SKIPPED' pytest.log | grep -v 'tests/scans'; then
            echo "These oracle/gs/slow tests were skipped (only tests/scans may skip)." >&2
            exit 1
          fi
