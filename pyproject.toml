[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optar"
dynamic = ["version"]
description = "Store files on paper: Python port of optar/unoptar"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
dependencies = ["numpy", "Pillow"]

[project.scripts]
optar = "optar.cli:main"

[project.gui-scripts]
optar-gui = "optar_gui.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff", "pyinstaller"]
gui = ["PySide6-Essentials>=6.6"]
gui-dev = ["optar[gui]", "pytest-qt"]

[tool.hatch.version]
path = "src/optar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/optar", "src/optar_gui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "gs: needs Ghostscript",
    "slow: long-running test, deselected by default",
    "gui: the desktop application (needs PySide6 and pytest-qt)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
