cut = "The name is too long for the page and is cut."
stored = "The pages do not need it: the full name is kept with the file."
printed = "The printed name is what identifies the pages later."

# A scan made at too low a resolution; {measured} is rounded to the nearest 10.
[gui.coarse]
page = "Scanned too coarsely for this page: about {measured} dpi. Scan it at {needed} dpi."
