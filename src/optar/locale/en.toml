[language]
name = "English"

[format]
group = ","
decimal = "."

[cli]
ACTUAL_SIZE = 'Print at actual size (100%), not "fit to page".'
PAPER_HINT = "Check that --paper matches the printout and that the page is scanned upright."
description = "Store files on paper."
after_encoding = "{actual_size} Scan at {dpi} dpi."
or_two = "{first} or {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "wrote {path}"
format_does_not_fit = "format {format} does not fit on {paper} paper"
cannot_open = "cannot open {path}"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "--compatible cannot be used with {options}"
format_conflict = "--format cannot be used with {options}"
slow_reader = "optar: {name}: the ordinary reader could not read this scan's data; trying the slower reader, which takes about a minute"
debug_images_unavailable = "optar: --debug-images is not available for self-identifying pages"
force_no_effect = "optar: --force has no effect on printouts from 0.2.0 or earlier"
gap = "optar: {missing} is missing but {existing} exists"
page_stats = "page {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force saves what was recovered, which may be damaged."
dot_need = "{name} {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
one = "wrote {path} ({count} page)"
other = "wrote {path} ({count} pages)"

[cli.dot_name]
standard = "Standard"
medium = "Medium"
big = "Big"
large = "Large"
xlarge = "Extra large"

[cli.protection]
nothing = "Protection {level}: nothing is repaired; a lost or damaged page loses part of the file."
within = "Protection {level}: repairs damage within pages; it cannot make up for a lost page."

[cli.protection.lose]
one = "Protection {level}: can lose {count} page of {total} and still recover the file."
other = "Protection {level}: can lose {count} pages of {total} and still recover the file."

[cli.scan]
missing = "optar: {name}: {reason}; counted as a missing page."
page = "{name}: page {page} of {total}{note}"
page_again_better = "{name}: page {page} of {total} again{note}; using the better scan"
page_again_earlier = "{name}: page {page} of {total} again{note}; using the earlier scan"
note_slow = " (read by the slower reader)"

[cli.probe]
unread = "could not be read ({detail})"
unidentified = "not identified ({detail})"
coarse = "not identified ({detail}); it was scanned at about {dpi} dpi, the dot sizes need: {needs}"
coarse_tried = "not identified ({detail}); it was scanned at about {dpi} dpi (the slower reader was tried too), the dot sizes need: {needs}"

[cli.scan.note_unreadable]
one = ", {count} byte unreadable"
other = ", {count} bytes unreadable"

[cli.scan.ignored]
one = "optar: {count} scan from another document was ignored: {names}"
other = "optar: {count} scans from another document were ignored: {names}"

[cli.summary]
too_many_missing = "too many pages are missing to repair the file"
worst = "worst codeword used {used} of {budget}"
none_missing = "no pages missing"
separator = "; "
line = "optar: {summary}"

[cli.summary.repaired]
one = "repaired {count} byte"
other = "repaired {count} bytes"

[cli.summary.blocks_failed]
one = "{count} block could not be repaired"
other = "{count} blocks could not be repaired"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "missing page {list}"
several = "missing pages {list}"

[cli.too_few.read]
one = "optar: the file could not be repaired and was not saved: only {read} of {count} page read."
other = "optar: the file could not be repaired and was not saved: only {read} of {count} pages read."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "Scan page {list} and decode again; --force saves nothing from fewer than one page in {fraction}."
several = "Scan pages {list} and decode again; --force saves nothing from fewer than one page in {fraction}."

[cli.verified]
one = "optar: file verified ({count} byte)"
other = "optar: file verified ({count} bytes)"

[cli.force_saved]
unrepaired = "optar: the file could not be repaired: it did not verify and may be damaged. Saved anyway because of --force."
mismatch = "optar: the file does not match its fingerprint: it did not verify and may be damaged. Saved anyway because of --force."

[cli.not_saved]
unrepaired = "optar: the file could not be repaired and was not saved. {advice}"
mismatch = "optar: the file does not match its fingerprint and was not saved. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "Rescan page {list} and decode again; {force}"
several = "Rescan pages {list} and decode again; {force}"

[cli.list_more]
one = "({count} more)"
other = "({count} more)"

[cli.stat_symbols]
one = "{count} symbols"
other = "{count} symbols"

[cli.stat_corrected]
one = "{count} corrected"
other = "{count} corrected"

[cli.stat_uncorrectable]
one = "{count} uncorrectable"
other = "{count} uncorrectable"

[cli.uncorrectable_codewords]
one = "optar: {count} uncorrectable codewords. {hint}"
other = "optar: {count} uncorrectable codewords. {hint}"

[cli.argparse]
usage = "usage: "
positionals = "positional arguments"
options = "options"
error = "{prog}: error: {message}"
help = "show this help message and exit"
version = "show program's version number and exit"

[cli.help]
paper = "paper size (default: a4)"
format = "override the page format"
encode = "encode a file into printable pages"
input = "file to encode"
output = "output base name (default: optar_out)"
to = "output type: one PDF (default), or PNG or PGM page files"
label = "text printed on each page (default: the file name given with -o)"
no_tag = "do not add the size, fingerprint and check tag to the page labels"
dots = "dot size (default: standard). Any size but standard makes self-identifying pages, protected at the standard level unless --protect says otherwise"
protect = "repair data spread over the whole document; makes self-identifying pages, with standard dots unless --dots says otherwise. Use 'none' for self-identifying pages without protection. Without --dots and --protect the pages are compatible and unprotected"
compatible = "pages that optar 0.2 and the C tool read (the default without --dots and --protect)"
decode = "decode scanned pages back into a file"
base = "scans are BASE_0001.png, BASE_0002.png, ..."
decode_output = "output file (default: stdout)"
debug_images = "write BASE_NNNN_debug.png"
force = "save what was recovered of self-identifying pages even if it did not verify"
no_slow_reader = "do not try the slower reader on scans the ordinary reader cannot identify"

# Library errors (optar.errors): each entry is the English text of the error,
# word for word; a test compares them with the code.
[err]
cannot_read = "cannot read {path}: {reason}"
cannot_write = "cannot write {path}: {reason}"
unknown_paper = "unknown paper {name}; known: {known}"
unknown_dots = "unknown dot size {name}; known: {known}"
format_syntax = "page format must be eight dash-separated integers: {text}"
label_band = "label band must be {rows} rows, not {height}"
label_font = "cannot read a label band of {height} rows; the font is {rows}"
too_many_pages = "too many pages: {total} needed, at most {limit}"
too_large_to_protect = "too large to protect: {size} bytes on paper, at most {limit}"
unknown_parity = "parity must be one of {known}, not {parity}"
format_too_small = "page format {format} is too small for the container"
format_cannot_end = "page format {format} cannot end a stream on a page"
impossible_document = "the pages describe a document that cannot exist: {total} pages for a file of {size} bytes"
image_too_large = "cannot read image {path}: {pixels} pixels is more than the {limit} a scan may have"
image_size_changed = "cannot read image {path}: image size changed while loading"
not_an_image = "cannot read image {path}: not a {formats} image"
image_unreadable = "cannot read image {path}: {reason}"
no_page = "no page found"
label_unreadable = "label unreadable"
scan_not_grey = "scan must be a 2-D uint8 grey image, got shape {shape} dtype {dtype}"
scan_empty = "scan is empty"
scan_too_small = "scan of {width} x {height} pixels is smaller than the page format's {page_width} x {page_height}"
corners_coincide = "page corners are degenerate (they coincide)"
page_too_small = "page found in the scan is too small to locate its crosses"
too_few_dots = "too few known dots on the page to learn from"
page_size = "a {width} x {height} pixel page is not the {page_width} x {page_height} pixel page of the {dots} dot layout on {paper} paper"
page_clipped = "a {width} x {height} pixel page leaves less than the {margin} pt margin on {paper} paper and would be clipped by the printer"
strip_needs_layout = "a label strip needs the layout of its page"
strip_too_large = "a {width} x {height} label strip does not fit the label band of the {dots} dot layout"
no_pages = "no pages to write"

[err.invalid_format]
version = "invalid page format: version must be 0"
fec_order = "invalid page format: fec_order must be 1..5"
xcrosses = "invalid page format: xcrosses must be >= 2"
ycrosses = "invalid page format: ycrosses must be >= 2"
chalf = "invalid page format: chalf must be >= 1"
cpitch = "invalid page format: cpitch must exceed 2*chalf"
border = "invalid page format: border must be >= 1"
text_height = "invalid page format: text_height must be >= 1"

[err.no_corner]
upper_left = "cannot find upper left corner"
upper_right = "cannot find upper right corner"
lower_left = "cannot find lower left corner"
lower_right = "cannot find lower right corner"

[count.page]
one = "{n} page"
other = "{n} pages"

[count.byte]
one = "{n} byte"
other = "{n} bytes"

[count.block]
one = "{n} block"
other = "{n} blocks"

[count.dot]
one = "{n} dot"
other = "{n} dots"

[count.scan]
one = "{n} scan"
other = "{n} scans"

# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Read from paper"
ADD_SCANS = "+ Add scans…"
REMOVE_SCAN = "Remove"
SAVE_FILE = "Save file…"
ADD_SCANS_TITLE = "Add scans"
SAVE_TITLE = "Save the recovered file"
CONFIRM_SAVE_TITLE = "Save anyway?"
ERROR_TITLE = "Could not save"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "Not part of this file"
NOT_READABLE = "Not readable"
BEING_READ_SECTION = "Being read"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Replace scan…"
USE_SPARE = "Use this scan"
SWITCH_DOCUMENT = "Switch to this document"
ASSIGN_PAGE = "Assign to page…"
START_BY_HAND = "Start a document by hand…"
REPLACE_REJECTED_TITLE = "Scan not used"
ASSIGN_TITLE = "Assign to a page"
PAGE_FIELD = "Page:"
START_BY_HAND_TITLE = "Start a document by hand"
START_BY_HAND_PROMPT = "No scan could be identified. Give the paper and the number of pages of the printout, then assign each scan to its page."
TOTAL_FIELD = "Pages:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Still writing a file"
STILL_WRITING = "A file is still being written. Wait until it is finished? If you close now, it may not be written."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "a save is already running"
SAVE_AFTER_CLOSE = "the window has been closed, so nothing more can be saved"
# The "Put on paper" tab.
WRITE_TAB = "Put on paper"
FILE_FIELD = "File:"
PAPER_FIELD = "Paper:"
NAME_FIELD = "Name:"
PRINTS_AS_FIELD = "Prints as:"
DOTS_FIELD = "Dot size:"
PROTECT_FIELD = "Protection:"
CHOOSE_FILE = "Choose…"
CHOOSE_FILE_TITLE = "Choose a file to put on paper"
CREATE_PDF = "Create PDF…"
CREATE_TITLE = "Save the PDF"
PDF_FILTER = "PDF (*.pdf);;All files (*)"
PREPARING = "Reading the file…"
CREATING = "Creating the PDF…"
COMPATIBLE = "Compatible with optar 0.2 and the original optar"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "the PDF would replace the file being put on paper; choose another name"
# After the pages and size of a protected file that may lose no whole page.
DAMAGE_REPAIRED = "damage within pages is repaired, but losing a whole page loses the file"
# What a document without a name is called.
NO_NAME = "(no name)"
# A document whose file was recovered and matches its fingerprint.
VERIFIED = "File recovered and verified"
# The bottom bar while scans are being read and the document has nothing else to say.
WORKING = "Working…"
# The bar while a document is repaired and checked in the background.
REPAIRING = "Repairing and checking the fingerprint…"
# Why a page whose data says it repairs itself gave no data to repair with.
NO_PAGE_DATA = "The data of this page could not be read"
PREVIEW_LOADING = "Loading…"
# A scan the ordinary reader could not read, while the slower reader tries it.
READING_COARSE = "Reading a coarse scan with the slower reader; this takes about a minute"
# After "too coarse to read": the slower reader could not read the scan either.
SLOW_TRIED = "The slower reader for coarse scans was tried too, and could not read it."
# A page read by the slower reader: in its detail (made a sentence by "sentence"
# below), and in its row.
READ_SLOWLY = "Read by the slower reader for coarse scans"
READ_SLOWLY_ROW = "Read by the slower reader"
# The step of a scan not started yet.
WAITING = "Waiting"
# The choice of language.
LANGUAGE_MENU = "Language"
SYSTEM_LANGUAGE = "System default"
# A phrase made a sentence, where the window shows it as a line of its own after
# others (a detail panel, a reason after "was not used"): {words} with the full
# stop of your language. A phrase that already ends with it is shown as it is.
sentence = "{words}."

# The terminal messages of optar-gui.
[gui.cli]
missing_qt = "optar-gui needs PySide6: run pip install '.[gui]' in a checkout of the source, or download optar-gui from the project's Releases page."
description = "Store files on paper and read them back."
version_help = "print the version and exit"

[gui.button]
ok = "OK"
cancel = "Cancel"
save = "Save"
yes = "Yes"
no = "No"

# Paper names, by the paper's name in optar.format.
[gui.paper]
