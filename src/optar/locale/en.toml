none_wrong = "After verification: none of this page's bytes were wrong."

[gui.slow.repaired]
one = "After verification: {n} of this page's bytes was wrong and was repaired by the document's protection."
other = "After verification: {n} of this page's bytes were wrong and were repaired by the document's protection."

