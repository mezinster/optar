# Polski katalog optar: klucze, kolejność i angielskie komentarze jak w en.toml; terminy według docs/superpowers/glossaries/pl.md.

[language]
name = "Polski"

[format]
group = " "
decimal = ","

[cli]
ACTUAL_SIZE = "Drukuj w rozmiarze rzeczywistym (100%), a nie z opcją „Dopasuj do strony”."
PAPER_HINT = "Sprawdź, czy --paper odpowiada wydrukowi i czy strona jest zeskanowana we właściwym położeniu (nieobrócona)."
description = "Przechowywanie plików na papierze."
after_encoding = "{actual_size} Skanuj w rozdzielczości {dpi} dpi."
or_two = "{first} lub {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "zapisano {path}"
format_does_not_fit = "format {format} nie mieści się na papierze {paper}"
cannot_open = "nie można otworzyć {path}"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "opcji --compatible nie można używać razem z {options}"
format_conflict = "opcji --format nie można używać razem z {options}"
slow_reader = "optar: {name}: zwykła metoda odczytu nie zdołała odczytać danych tego skanu; uruchamiana jest wolniejsza metoda, co zajmie około minuty"
debug_images_unavailable = "optar: opcja --debug-images jest niedostępna dla stron samoidentyfikujących"
force_no_effect = "optar: opcja --force nie działa na wydruki z wersji 0.2.0 i wcześniejszych"
gap = "optar: brak pliku {missing}, choć plik {existing} istnieje"
page_stats = "strona {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force zapisuje to, co udało się odzyskać, ale może to być uszkodzone."
dot_need = "{name} – {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
one = "zapisano {path} ({count} strona)"
few = "zapisano {path} ({count} strony)"
many = "zapisano {path} ({count} stron)"

[cli.dot_name]
standard = "standardowe"
medium = "średnie"
big = "duże"
large = "bardzo duże"
xlarge = "ogromne"

[cli.protection]
nothing = "Poziom ochrony {level}: nic nie jest naprawiane; utrata lub uszkodzenie strony oznacza utratę części pliku."
within = "Poziom ochrony {level}: naprawia uszkodzenia wewnątrz stron, ale nie zastąpi utraconej strony."

[cli.protection.lose]
one = "Poziom ochrony {level}: można utracić {count} stronę z {total} i nadal odzyskać plik."
few = "Poziom ochrony {level}: można utracić {count} strony z {total} i nadal odzyskać plik."
many = "Poziom ochrony {level}: można utracić {count} stron z {total} i nadal odzyskać plik."

[cli.scan]
missing = "optar: {name}: {reason}; uznano za brakującą stronę."
page = "{name}: strona {page} z {total}{note}"
page_again_better = "{name}: ponownie strona {page} z {total}{note}; użyto lepszego skanu"
page_again_earlier = "{name}: ponownie strona {page} z {total}{note}; użyto wcześniejszego skanu"
note_slow = " (odczytana wolniejszą metodą)"

[cli.probe]
unread = "nie udało się odczytać ({detail})"
unidentified = "nie zidentyfikowano ({detail})"
coarse = "nie zidentyfikowano ({detail}); rozdzielczość skanu to około {dpi} dpi, a rozmiary kropek wymagają: {needs}"
coarse_tried = "nie zidentyfikowano ({detail}); rozdzielczość skanu to około {dpi} dpi (wypróbowano też wolniejszą metodę), a rozmiary kropek wymagają: {needs}"

[cli.scan.note_unreadable]
one = ", {count} bajt nieczytelny"
few = ", {count} bajty nieczytelne"
many = ", {count} bajtów nieczytelnych"

[cli.scan.ignored]
one = "optar: pominięto {count} skan z innego dokumentu: {names}"
few = "optar: pominięto {count} skany z innego dokumentu: {names}"
many = "optar: pominięto {count} skanów z innego dokumentu: {names}"

[cli.summary]
too_many_missing = "brakuje zbyt wielu stron, by naprawić plik"
worst = "najgorsze słowo kodowe wykorzystało {used} z {budget}"
none_missing = "nie brakuje żadnej strony"
separator = "; "
line = "optar: {summary}"

[cli.summary.repaired]
one = "naprawiono {count} bajt"
few = "naprawiono {count} bajty"
many = "naprawiono {count} bajtów"

[cli.summary.blocks_failed]
one = "{count} blok pozostał nienaprawiony"
few = "{count} bloki pozostały nienaprawione"
many = "{count} bloków pozostało nienaprawionych"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "brak strony {list}"
several = "brak stron {list}"

[cli.too_few.read]
one = "optar: plik nie dał się naprawić i nie został zapisany: odczytano tylko {read} z {count} strony."
few = "optar: plik nie dał się naprawić i nie został zapisany: odczytano tylko {read} z {count} stron."
many = "optar: plik nie dał się naprawić i nie został zapisany: odczytano tylko {read} z {count} stron."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "Zeskanuj stronę {list} i ponów dekodowanie; --force nie zapisze niczego, jeśli odczytano mniej niż jedną stronę na każde {fraction}."
several = "Zeskanuj strony {list} i ponów dekodowanie; --force nie zapisze niczego, jeśli odczytano mniej niż jedną stronę na każde {fraction}."

[cli.verified]
one = "optar: plik zweryfikowany ({count} bajt)"
few = "optar: plik zweryfikowany ({count} bajty)"
many = "optar: plik zweryfikowany ({count} bajtów)"

[cli.force_saved]
unrepaired = "optar: plik nie dał się naprawić: nie przeszedł weryfikacji i może być uszkodzony. Mimo to zapisano go z powodu --force."
mismatch = "optar: plik nie zgadza się ze swoim odciskiem: nie przeszedł weryfikacji i może być uszkodzony. Mimo to zapisano go z powodu --force."

[cli.not_saved]
unrepaired = "optar: plik nie dał się naprawić i nie został zapisany. {advice}"
mismatch = "optar: plik nie zgadza się ze swoim odciskiem i nie został zapisany. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "Zeskanuj ponownie stronę {list} i ponów dekodowanie; {force}"
several = "Zeskanuj ponownie strony {list} i ponów dekodowanie; {force}"

[cli.list_more]
one = "(jeszcze {count})"
few = "(jeszcze {count})"
many = "(jeszcze {count})"

[cli.stat_symbols]
one = "{count} symbol"
few = "{count} symbole"
many = "{count} symboli"

[cli.stat_corrected]
one = "{count} skorygowany"
few = "{count} skorygowane"
many = "{count} skorygowanych"

[cli.stat_uncorrectable]
one = "{count} nie do skorygowania"
few = "{count} nie do skorygowania"
many = "{count} nie do skorygowania"

[cli.uncorrectable_codewords]
one = "optar: {count} słowo kodowe nie do skorygowania. {hint}"
few = "optar: {count} słowa kodowe nie do skorygowania. {hint}"
many = "optar: {count} słów kodowych nie do skorygowania. {hint}"

[cli.argparse]
usage = "użycie: "
positionals = "argumenty pozycyjne"
options = "opcje"
error = "{prog}: błąd: {message}"
help = "wyświetl tę pomoc i zakończ"
version = "wyświetl numer wersji programu i zakończ"

[cli.help]
paper = "rozmiar papieru (domyślnie: a4)"
format = "użyj innego formatu strony niż domyślny"
encode = "zakoduj plik jako strony do wydrukowania"
input = "plik do zakodowania"
output = "podstawowa nazwa plików wynikowych (domyślnie: optar_out)"
to = "rodzaj wyniku: jeden plik PDF (domyślnie) albo pliki stron PNG lub PGM"
label = "tekst drukowany na każdej stronie (domyślnie: nazwa pliku podana w -o)"
no_tag = "nie dodawaj do napisów na stronach znacznika z rozmiarem, odciskiem i wartością kontrolną"
dots = "rozmiar kropek (domyślnie: standard). Każdy rozmiar inny niż standard daje strony samoidentyfikujące z ochroną na poziomie standard, chyba że --protect określa inaczej"
protect = "dane naprawcze rozłożone na cały dokument; daje strony samoidentyfikujące z kropkami rozmiaru standard, chyba że --dots określa inaczej. Wartość „none” daje strony samoidentyfikujące bez ochrony. Bez --dots i --protect strony są zgodne i bez ochrony"
compatible = "strony czytelne dla optar 0.2 i programu w C (domyślnie, gdy nie podano --dots ani --protect)"
decode = "zdekoduj zeskanowane strony z powrotem do pliku"
base = "skany to BASE_0001.png, BASE_0002.png itd."
decode_output = "plik wynikowy (domyślnie: stdout)"
debug_images = "zapisz BASE_NNNN_debug.png"
force = "zapisz to, co udało się odzyskać ze stron samoidentyfikujących, nawet jeśli plik nie przeszedł weryfikacji"
no_slow_reader = "nie stosuj wolniejszej metody odczytu do skanów, których zwykła metoda nie może zidentyfikować"

# Library errors (optar.errors): each entry is the English text of the error,
# word for word; a test compares them with the code.
[err]
cannot_read = "nie można odczytać {path}: {reason}"
cannot_write = "nie można zapisać {path}: {reason}"
unknown_paper = "nieznany papier {name}; znane: {known}"
unknown_dots = "nieznany rozmiar kropek {name}; znane: {known}"
format_syntax = "format strony musi składać się z ośmiu liczb całkowitych rozdzielonych łącznikami: {text}"
label_band = "nieprawidłowa wysokość pasa napisu: {height} zamiast {rows} (w wierszach pikseli)"
label_font = "nie można odczytać pasa napisu o wysokości {height}: czcionka ma wysokość {rows} (w wierszach pikseli)"
too_many_pages = "za dużo stron: potrzeba {total}, dopuszczalne najwyżej {limit}"
too_large_to_protect = "plik jest za duży, by objąć go ochroną: {size} B na papierze, dopuszczalne najwyżej {limit}"
unknown_parity = "parzystość musi być jedną z wartości {known}, a nie {parity}"
format_too_small = "format strony {format} jest za mały dla kontenera"
format_cannot_end = "format strony {format} nie pozwala zakończyć strumienia na stronie"
impossible_document = "strony opisują dokument, który nie może istnieć: liczba stron {total} przy pliku o rozmiarze {size} B"
image_too_large = "nie można odczytać obrazu {path}: liczba pikseli ({pixels}) przekracza dopuszczalną dla skanu ({limit})"
image_size_changed = "nie można odczytać obrazu {path}: rozmiar obrazu zmienił się podczas wczytywania"
not_an_image = "nie można odczytać obrazu {path}: to nie jest obraz {formats}"
image_unreadable = "nie można odczytać obrazu {path}: {reason}"
no_page = "nie znaleziono strony"
label_unreadable = "napis jest nieczytelny"
scan_not_grey = "skan musi być dwuwymiarowym obrazem w skali szarości typu uint8, a ma kształt {shape} i typ {dtype}"
scan_empty = "skan jest pusty"
scan_too_small = "skan {width} × {height} px jest mniejszy niż strona tego formatu ({page_width} × {page_height} px)"
corners_coincide = "narożniki strony są zdegenerowane (pokrywają się)"
page_too_small = "strona znaleziona na skanie jest za mała, by zlokalizować jej krzyżyki"
too_few_dots = "na stronie jest za mało znanych kropek, by dostroić na ich podstawie odczyt"
page_size = "strona {width} × {height} px nie odpowiada stronie {page_width} × {page_height} px układu (rozmiar kropek: {dots}, papier: {paper})"
page_clipped = "strona {width} × {height} px zostawia na papierze {paper} margines mniejszy niż {margin} pt i drukarka by ją przycięła"
strip_needs_layout = "pasek napisu wymaga układu swojej strony"
strip_too_large = "pasek napisu {width} × {height} nie mieści się w pasie napisu układu (rozmiar kropek: {dots})"
no_pages = "brak stron do zapisania"

[err.invalid_format]
version = "nieprawidłowy format strony: wartość version musi wynosić 0"
fec_order = "nieprawidłowy format strony: wartość fec_order musi wynosić od 1 do 5"
