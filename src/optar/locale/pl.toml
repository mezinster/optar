# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Odczytaj z papieru"
ADD_SCANS = "+ Dodaj skany…"
REMOVE_SCAN = "Usuń z listy"
SAVE_FILE = "Zapisz plik…"
ADD_SCANS_TITLE = "Dodaj skany"
SAVE_TITLE = "Zapisz odzyskany plik"
CONFIRM_SAVE_TITLE = "Zapisać mimo to?"
ERROR_TITLE = "Nie udało się zapisać"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "Spoza tego pliku"
NOT_READABLE = "Nieczytelne"
BEING_READ_SECTION = "W trakcie odczytu"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Zastąp skan…"
USE_SPARE = "Użyj tego skanu"
SWITCH_DOCUMENT = "Przełącz na ten dokument"
ASSIGN_PAGE = "Przypisz do strony…"
START_BY_HAND = "Złóż dokument ręcznie…"
REPLACE_REJECTED_TITLE = "Skanu nie użyto"
ASSIGN_TITLE = "Przypisz do strony"
PAGE_FIELD = "Strona:"
START_BY_HAND_TITLE = "Złóż dokument ręcznie"
START_BY_HAND_PROMPT = "Nie udało się zidentyfikować żadnego skanu. Podaj papier i liczbę stron wydruku, a potem przypisz każdy skan do jego strony."
TOTAL_FIELD = "Liczba stron:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Plik jest jeszcze zapisywany"
STILL_WRITING = "Plik jest jeszcze zapisywany. Poczekać, aż zapis się zakończy? Jeśli zamkniesz okno teraz, plik może nie zostać zapisany."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "zapisywanie już trwa"
SAVE_AFTER_CLOSE = "okno zostało zamknięte, więc nie można już nic zapisać"
# The "Put on paper" tab.
WRITE_TAB = "Zapisz na papierze"
FILE_FIELD = "Plik:"
PAPER_FIELD = "Papier:"
NAME_FIELD = "Nazwa:"
PRINTS_AS_FIELD = "Na wydruku:"
DOTS_FIELD = "Rozmiar kropek:"
PROTECT_FIELD = "Ochrona:"
CHOOSE_FILE = "Wybierz…"
CHOOSE_FILE_TITLE = "Wybierz plik do zapisania na papierze"
CREATE_PDF = "Utwórz PDF…"
CREATE_TITLE = "Zapisz PDF"
PDF_FILTER = "PDF (*.pdf);;Wszystkie pliki (*)"
PREPARING = "Wczytywanie pliku…"
CREATING = "Tworzenie pliku PDF…"
COMPATIBLE = "Zgodność z optar 0.2 i oryginalnym programem optar"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "PDF zastąpiłby plik zapisywany na papierze; wybierz inną nazwę"
# After the pages and size of a protected file that may lose no whole page.
DAMAGE_REPAIRED = "uszkodzenia wewnątrz stron są naprawiane, ale utrata całej strony oznacza utratę pliku"
# What a document without a name is called.
NO_NAME = "(bez nazwy)"
# A document whose file was recovered and matches its fingerprint.
VERIFIED = "Plik odzyskany i zweryfikowany"
# The bottom bar while scans are being read and the document has nothing else to say.
WORKING = "Przetwarzanie…"
# The bar while a document is repaired and checked in the background.
REPAIRING = "Naprawianie i sprawdzanie odcisku…"
# Why a page whose data says it repairs itself gave no data to repair with.
NO_PAGE_DATA = "Nie udało się odczytać danych tej strony"
PREVIEW_LOADING = "Wczytywanie…"
# A scan the ordinary reader could not read, while the slower reader tries it.
READING_COARSE = "Odczyt skanu o niskiej rozdzielczości wolniejszą metodą; potrwa to około minuty"
# After "too coarse to read": the slower reader could not read the scan either.
SLOW_TRIED = "Wypróbowano też wolniejszą metodę dla skanów o niskiej rozdzielczości, ale i ona nie odczytała skanu."
# A page read by the slower reader: in its detail (made a sentence by "sentence"
# below), and in its row.
READ_SLOWLY = "Odczytana wolniejszą metodą dla skanów o niskiej rozdzielczości"
READ_SLOWLY_ROW = "Odczytana wolniejszą metodą"
# The step of a scan not started yet.
WAITING = "W kolejce"
# The choice of language.
LANGUAGE_MENU = "Język"
SYSTEM_LANGUAGE = "Jak w systemie"
# A phrase made a sentence, where the window shows it as a line of its own after
# others (a detail panel, a reason after "was not used"): {words} with the full
# stop of your language. A phrase that already ends with it is shown as it is.
sentence = "{words}."

