range = "le pagine {first}–{last} sono ancora in lettura"

# What saving must confirm first.
[gui.save]
# {runs}: the runs above, then perhaps "more" below.
incomplete = "Il file salvato sarà incompleto: {runs}."
# {advice}: rescan advice (whole sentences).
unrepaired = "{advice} Se salvi ora, il file salvato conterrà solo ciò che è stato possibile recuperare e potrebbe contenere parti errate."
checking = "L'impronta è ancora in fase di controllo, quindi non si sa ancora se il file recuperato è l'originale."
empty = "Non c'è niente da salvare."
mismatch = "Il file recuperato non corrisponde all'impronta stampata sulla carta: alcuni dati sono stati decodificati in modo errato, quindi questo non è il file originale."
by_hand = "Questo documento è stato composto a mano, quindi il file non può essere verificato e verrà completato con zeri fino a una pagina intera."
untagged = "Queste pagine non hanno un contrassegno, quindi il file non può essere verificato e verrà completato con zeri fino a una pagina intera."

# After the runs a save warning names: the pages it does not name.
[gui.save.more]
one = "e ancora {n} pagina mancante o danneggiata"
other = "e altre {n} pagine mancanti o danneggiate"

# The standing caution over a document without a tag.
[gui.caution]
untagged = "Queste pagine non hanno un contrassegno, quindi non si può confermare che appartengano alla stessa stampa né che il file sia completo. Il file salvato verrà completato con zeri."
by_hand = "Questo documento è stato composto a mano, quindi non si può confermare che le pagine appartengano alla stessa stampa né che il file sia completo. Il file salvato verrà completato con zeri."

# Why a scan is unreadable, by the reason the program gives.
[gui.reason]
no_page = "In questa immagine non è stata trovata nessuna pagina optar"
label_unreadable = "Non è stato possibile leggere l'etichetta in fondo alla pagina"
