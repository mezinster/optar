other_page = "La scansione {name} non è stata usata per la pagina {page}: è la pagina {other} di questo documento e compare nell'elenco sotto quella pagina."
# {printout}: name · paper · pages.
other_document = "La scansione {name} non è stata usata per la pagina {page}: è la pagina {other} di un'altra stampa ({printout})."
