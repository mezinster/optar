unreadable = "Non è stato possibile leggere questa scansione"
reading = "Lettura in corso…"

# After "{n} blocks": {n} of them repaired.
[gui.detail.repaired]
one = "{n} riparato"
other = "{n} riparati"

[gui.detail.lost]
one = "{n} perso"
other = "{n} persi"

[gui.detail.restored]
one = "{n} riparato dalla protezione del documento"
other = "{n} riparati dalla protezione del documento"

# Rows of the list of scans.
[gui.row]
page = "Pagina {page}"
spare = "Di riserva"
# After the title of a spare's detail.
