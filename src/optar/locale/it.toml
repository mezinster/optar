format_mismatch = "Questa scansione è stata decodificata per un formato di carta diverso da quello del documento"
# A scan assigned to a page by hand that decodes badly whichever way up it is read.
not_decodable = "Non è stato possibile decodificare la scansione in nessun orientamento"

# The detail panel of a page.
[gui.detail]
title = "Pagina {page} di {total}"
repairs = "Riparazioni: {one} da un bit, {two} da due bit, {three} da tre bit"
missing = "Non è stata aggiunta nessuna scansione di questa pagina"
