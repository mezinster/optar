# Русский каталог optar. Ключи, порядок и комментарии — как в en.toml (комментарии
# оставлены на английском: они для переводчиков и сопровождающих). Термины — по
# глоссарию docs/superpowers/glossaries/ru.md.

[language]
name = "Русский"

[format]
group = "\u00a0"
decimal = ","

[cli]
ACTUAL_SIZE = "Печатайте в натуральную величину (100%), а не «По размеру страницы»."
PAPER_HINT = "Убедитесь, что --paper соответствует распечатке и что страница отсканирована в прямом положении (не повёрнута)."
description = "Хранение файлов на бумаге."
after_encoding = "{actual_size} Сканируйте с разрешением {dpi} dpi."
or_two = "{first} или {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "записан файл {path}"
format_does_not_fit = "формат {format} не помещается на бумагу {paper}"
cannot_open = "не удаётся открыть {path}"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "--compatible нельзя использовать вместе с {options}"
format_conflict = "--format нельзя использовать вместе с {options}"
slow_reader = "optar: {name}: обычный метод чтения не смог прочитать данные этого скана; запускается медленный метод, это займёт около минуты"
debug_images_unavailable = "optar: параметр --debug-images недоступен для самоопознающихся страниц"
force_no_effect = "optar: параметр --force не действует на распечатки версии 0.2.0 и более ранних"
gap = "optar: нет файла {missing}, хотя файл {existing} есть"
page_stats = "страница {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force сохраняет то, что удалось восстановить, но оно может быть повреждено."
dot_need = "{name} — {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
one = "записан файл {path} ({count} страница)"
few = "записан файл {path} ({count} страницы)"
many = "записан файл {path} ({count} страниц)"

[cli.dot_name]
standard = "стандартные"
medium = "средние"
big = "большие"
large = "крупные"
xlarge = "очень крупные"

[cli.protection]
nothing = "Уровень защиты {level}: ничего не исправляется; если страница потеряна или повреждена, теряется часть файла."
within = "Уровень защиты {level}: повреждения внутри страниц исправляются, но потерянную страницу восстановить нельзя."

[cli.protection.lose]
one = "Уровень защиты {level}: можно потерять {count} страницу из {total} и всё равно восстановить файл."
few = "Уровень защиты {level}: можно потерять {count} страницы из {total} и всё равно восстановить файл."
many = "Уровень защиты {level}: можно потерять {count} страниц из {total} и всё равно восстановить файл."

[cli.scan]
missing = "optar: {name}: {reason}; страница считается отсутствующей."
page = "{name}: страница {page} из {total}{note}"
page_again_better = "{name}: снова страница {page} из {total}{note}; используется лучший скан"
page_again_earlier = "{name}: снова страница {page} из {total}{note}; используется более ранний скан"
note_slow = " (прочитана медленным методом)"

[cli.probe]
unread = "не удалось прочитать ({detail})"
unidentified = "скан не опознан ({detail})"
coarse = "скан не опознан ({detail}); его разрешение — примерно {dpi} dpi, а для размеров точек нужно: {needs}"
coarse_tried = "скан не опознан ({detail}); его разрешение — примерно {dpi} dpi (медленный метод тоже был испробован), а для размеров точек нужно: {needs}"

[cli.scan.note_unreadable]
one = ", {count} байт не читается"
few = ", {count} байта не читаются"
many = ", {count} байт не читаются"

[cli.scan.ignored]
one = "optar: пропущен {count} скан другого документа: {names}"
few = "optar: пропущено {count} скана другого документа: {names}"
many = "optar: пропущено {count} сканов другого документа: {names}"

[cli.summary]
too_many_missing = "отсутствует слишком много страниц, чтобы исправить файл"
worst = "в худшем кодовом слове израсходовано {used} из {budget}"
none_missing = "отсутствующих страниц нет"
separator = "; "
line = "optar: {summary}"

[cli.summary.repaired]
one = "исправлен {count} байт"
few = "исправлено {count} байта"
many = "исправлено {count} байт"

[cli.summary.blocks_failed]
one = "{count} блок не удалось исправить"
few = "{count} блока не удалось исправить"
many = "{count} блоков не удалось исправить"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "нет страницы {list}"
several = "нет страниц {list}"

[cli.too_few.read]
one = "optar: файл не удалось исправить, и он не сохранён: прочитано только {read} из {count} страницы."
few = "optar: файл не удалось исправить, и он не сохранён: прочитано только {read} из {count} страниц."
many = "optar: файл не удалось исправить, и он не сохранён: прочитано только {read} из {count} страниц."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "Отсканируйте страницу {list} и повторите декодирование; --force ничего не сохраняет, если прочитано меньше одной страницы из каждых {fraction}."
several = "Отсканируйте страницы {list} и повторите декодирование; --force ничего не сохраняет, если прочитано меньше одной страницы из каждых {fraction}."

[cli.verified]
one = "optar: файл проверен ({count} байт)"
few = "optar: файл проверен ({count} байта)"
many = "optar: файл проверен ({count} байт)"

[cli.force_saved]
unrepaired = "optar: файл не удалось исправить: он не прошёл проверку и может быть повреждён. Всё равно сохранён из-за --force."
mismatch = "optar: файл не совпадает со своим отпечатком: он не прошёл проверку и может быть повреждён. Всё равно сохранён из-за --force."

[cli.not_saved]
unrepaired = "optar: файл не удалось исправить, и он не сохранён. {advice}"
mismatch = "optar: файл не совпадает со своим отпечатком и не сохранён. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "Отсканируйте заново страницу {list} и повторите декодирование; {force}"
several = "Отсканируйте заново страницы {list} и повторите декодирование; {force}"

[cli.list_more]
one = "(ещё {count})"
few = "(ещё {count})"
many = "(ещё {count})"

[cli.stat_symbols]
one = "{count} символ"
few = "{count} символа"
many = "{count} символов"

[cli.stat_corrected]
one = "скорректировано: {count}"
few = "скорректировано: {count}"
many = "скорректировано: {count}"

[cli.stat_uncorrectable]
one = "неисправимых: {count}"
few = "неисправимых: {count}"
many = "неисправимых: {count}"

[cli.uncorrectable_codewords]
one = "optar: {count} неисправимое кодовое слово. {hint}"
few = "optar: {count} неисправимых кодовых слова. {hint}"
many = "optar: {count} неисправимых кодовых слов. {hint}"

[cli.argparse]
usage = "использование: "
positionals = "позиционные аргументы"
options = "параметры"
error = "{prog}: ошибка: {message}"
help = "показать эту справку и выйти"
version = "показать номер версии программы и выйти"

[cli.help]
paper = "размер бумаги (по умолчанию: a4)"
format = "задать формат страницы вместо обычного"
encode = "закодировать файл в страницы для печати"
input = "файл, который нужно закодировать"
output = "базовое имя выходных файлов (по умолчанию: optar_out)"
to = "вид результата: один PDF (по умолчанию) или файлы страниц PNG либо PGM"
label = "текст, печатаемый на каждой странице (по умолчанию: имя файла, заданное в -o)"
no_tag = "не добавлять в надписи страниц метку с размером, отпечатком и контрольным значением"
dots = "размер точек (по умолчанию: standard). Любой размер, кроме standard, даёт самоопознающиеся страницы с защитой уровня standard, если --protect не задаёт другой уровень"
protect = "данные для исправления, распределённые по всему документу; даёт самоопознающиеся страницы, с точками размера standard, если --dots не задаёт другой размер. Значение «none» даёт самоопознающиеся страницы без защиты. Без --dots и --protect страницы получаются совместимыми и без защиты"
compatible = "страницы, которые читают optar 0.2 и программа на C (по умолчанию, если нет --dots и --protect)"
decode = "декодировать отсканированные страницы обратно в файл"
base = "сканы: BASE_0001.png, BASE_0002.png и т. д."
decode_output = "выходной файл (по умолчанию: stdout)"
debug_images = "записать BASE_NNNN_debug.png"
force = "сохранить то, что удалось восстановить из самоопознающихся страниц, даже если файл не прошёл проверку"
no_slow_reader = "не применять медленный метод чтения к сканам, которые обычный метод не может опознать"

# Library errors (optar.errors): each entry is the English text of the error,
# word for word; a test compares them with the code.
[err]
cannot_read = "не удаётся прочитать {path}: {reason}"
cannot_write = "не удаётся записать {path}: {reason}"
unknown_paper = "неизвестная бумага {name}; известные: {known}"
unknown_dots = "неизвестный размер точек {name}; известные: {known}"
format_syntax = "формат страницы должен состоять из восьми целых чисел через дефис: {text}"
label_band = "неверная высота полосы надписи: {height} вместо {rows} (в строках пикселей)"
label_font = "не удаётся прочитать полосу надписи высотой {height}: высота шрифта — {rows} (в строках пикселей)"
too_many_pages = "слишком много страниц: нужно {total}, допускается не больше {limit}"
