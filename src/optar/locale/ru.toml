# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Прочитать с бумаги"
ADD_SCANS = "+ Добавить сканы…"
REMOVE_SCAN = "Убрать"
SAVE_FILE = "Сохранить файл…"
ADD_SCANS_TITLE = "Добавить сканы"
SAVE_TITLE = "Сохранить восстановленный файл"
CONFIRM_SAVE_TITLE = "Всё равно сохранить?"
ERROR_TITLE = "Не удалось сохранить"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "Не относятся к этому файлу"
NOT_READABLE = "Не читаются"
BEING_READ_SECTION = "Читаются"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Заменить скан…"
USE_SPARE = "Взять этот скан"
SWITCH_DOCUMENT = "Перейти к этому документу"
ASSIGN_PAGE = "Указать страницу…"
START_BY_HAND = "Собрать документ вручную…"
REPLACE_REJECTED_TITLE = "Скан не использован"
ASSIGN_TITLE = "Указать страницу"
PAGE_FIELD = "Страница:"
START_BY_HAND_TITLE = "Собрать документ вручную"
START_BY_HAND_PROMPT = "Ни один скан не удалось опознать. Укажите бумагу и число страниц распечатки, а затем — страницу для каждого скана."
TOTAL_FIELD = "Страниц:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Файл ещё записывается"
STILL_WRITING = "Файл ещё записывается. Подождать, пока запись закончится? Если закрыть окно сейчас, файл может остаться незаписанным."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "сохранение уже идёт"
SAVE_AFTER_CLOSE = "окно закрыто, поэтому больше ничего сохранить нельзя"
# The "Put on paper" tab.
WRITE_TAB = "Записать на бумагу"
FILE_FIELD = "Файл:"
PAPER_FIELD = "Бумага:"
NAME_FIELD = "Имя:"
PRINTS_AS_FIELD = "Печатается как:"
DOTS_FIELD = "Размер точек:"
PROTECT_FIELD = "Защита:"
CHOOSE_FILE = "Выбрать…"
CHOOSE_FILE_TITLE = "Выбрать файл для записи на бумагу"
CREATE_PDF = "Создать PDF…"
CREATE_TITLE = "Сохранить PDF"
PDF_FILTER = "PDF (*.pdf);;Все файлы (*)"
PREPARING = "Чтение файла…"
CREATING = "Создание PDF…"
COMPATIBLE = "Совместимость с optar 0.2 и первоначальной программой optar"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "PDF заменил бы файл, который записывается на бумагу; выберите другое имя"
# After the pages and size of a protected file that may lose no whole page.
DAMAGE_REPAIRED = "повреждения внутри страниц исправляются, но если потерять целую страницу, файл будет потерян"
# What a document without a name is called.
NO_NAME = "(без имени)"
# A document whose file was recovered and matches its fingerprint.
VERIFIED = "Файл восстановлен и проверен"
# The bottom bar while scans are being read and the document has nothing else to say.
WORKING = "Обработка…"
# The bar while a document is repaired and checked in the background.
REPAIRING = "Исправление и сверка с отпечатком…"
# Why a page whose data says it repairs itself gave no data to repair with.
NO_PAGE_DATA = "Данные этой страницы не удалось прочитать"
PREVIEW_LOADING = "Загрузка…"
# A scan the ordinary reader could not read, while the slower reader tries it.
READING_COARSE = "Скан с низким разрешением читается медленным методом; это займёт около минуты"
# After "too coarse to read": the slower reader could not read the scan either.
SLOW_TRIED = "Медленный метод для сканов с низким разрешением тоже был испробован, но и он не смог прочитать скан."
# A page read by the slower reader: in its detail (made a sentence by "sentence"
# below), and in its row.
READ_SLOWLY = "Прочитана медленным методом для сканов с низким разрешением"
READ_SLOWLY_ROW = "Прочитана медленным методом"
# The step of a scan not started yet.
WAITING = "В очереди"
# The choice of language.
LANGUAGE_MENU = "Язык"
SYSTEM_LANGUAGE = "Как в системе"
# A phrase made a sentence, where the window shows it as a line of its own after
# others (a detail panel, a reason after "was not used"): {words} with the full
# stop of your language. A phrase that already ends with it is shown as it is.
sentence = "{words}."

