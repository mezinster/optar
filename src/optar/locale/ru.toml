format_too_small = "формат страницы {format} слишком мал для контейнера"
format_cannot_end = "формат страницы {format} не позволяет закончить поток на странице"
impossible_document = "страницы описывают невозможный документ: страниц — {total}, а размер файла в байтах — {size}"
image_too_large = "не удаётся прочитать изображение {path}: пикселей в нём {pixels}, а в скане допускается не больше {limit}"
image_size_changed = "не удаётся прочитать изображение {path}: размер изображения изменился во время загрузки"
not_an_image = "не удаётся прочитать изображение {path}: это не изображение {formats}"
image_unreadable = "не удаётся прочитать изображение {path}: {reason}"
no_page = "страница не найдена"
label_unreadable = "надпись не читается"
scan_not_grey = "скан должен быть двумерным изображением в оттенках серого типа uint8, а получена форма {shape}, тип {dtype}"
scan_empty = "скан пуст"
scan_too_small = "скан {width} × {height} пикс. меньше, чем страница этого формата ({page_width} × {page_height})"
corners_coincide = "углы страницы вырождены (совпадают)"
page_too_small = "страница, найденная на скане, слишком мала, чтобы найти на ней кресты"
too_few_dots = "на странице слишком мало известных точек, чтобы настроиться по ним"
page_size = "страница {width} × {height} пикс. не совпадает со страницей {page_width} × {page_height} пикс. для размера точек {dots} на бумаге {paper}"
page_clipped = "страница {width} × {height} пикс. оставляет на бумаге {paper} поле меньше {margin} пт, и принтер её обрежет"
strip_needs_layout = "ленте надписи нужен макет её страницы"
strip_too_large = "лента надписи {width} × {height} не помещается в полосу надписи макета с размером точек {dots}"
no_pages = "нет страниц для записи"

[err.invalid_format]
version = "неверный формат страницы: значение version должно быть 0"
fec_order = "неверный формат страницы: значение fec_order должно быть от 1 до 5"
xcrosses = "неверный формат страницы: значение xcrosses должно быть >= 2"
ycrosses = "неверный формат страницы: значение ycrosses должно быть >= 2"
chalf = "неверный формат страницы: значение chalf должно быть >= 1"
cpitch = "неверный формат страницы: значение cpitch должно быть больше 2*chalf"
