[err]
cannot_read = "{path} okunamıyor: {reason}"
cannot_write = "{path} yazılamıyor: {reason}"
unknown_paper = "bilinmeyen kâğıt: {name}; bilinenler: {known}"
unknown_dots = "bilinmeyen nokta boyutu: {name}; bilinenler: {known}"
format_syntax = "sayfa biçimi, tirelerle ayrılmış sekiz tam sayı olmalıdır: {text}"
label_band = "etiket alanının yüksekliği {rows} satır olmalı, {height} satır değil"
label_font = "{height} satırlık bir etiket alanı okunamaz; yazı tipinin yüksekliği {rows} satır"
too_many_pages = "çok fazla sayfa: {total} sayfa gerekiyor, en çok {limit} olabilir"
too_large_to_protect = "korunamayacak kadar büyük: kâğıt üzerinde {size} bayt, en çok {limit} olabilir"
unknown_parity = "eşlik düzeyi şu değerlerden biri olmalı: {known}; verilen: {parity}"
format_too_small = "{format} sayfa biçimi kapsayıcı için çok küçük"
format_cannot_end = "{format} sayfa biçimiyle bir akış bir sayfada sonlandırılamaz"
impossible_document = "sayfalar var olamayacak bir belgeyi tanımlıyor: {size} baytlık bir dosya için {total} sayfa"
image_too_large = "{path} görüntüsü okunamıyor: {pixels} piksel, bir tarama için izin verilen {limit} sınırını aşıyor"
image_size_changed = "{path} görüntüsü okunamıyor: görüntünün boyutu yüklenirken değişti"
not_an_image = "{path} görüntüsü okunamıyor: {formats} görüntüsü değil"
image_unreadable = "{path} görüntüsü okunamıyor: {reason}"
no_page = "sayfa bulunamadı"
label_unreadable = "etiket okunamıyor"
scan_not_grey = "tarama 2 boyutlu, uint8 türünde gri tonlamalı bir görüntü olmalı; gelen: şekil {shape}, dtype {dtype}"
scan_empty = "tarama boş"
scan_too_small = "{width} x {height} piksellik tarama, sayfa biçiminin {page_width} x {page_height} boyutundan küçük"
corners_coincide = "sayfa köşeleri bozuk (çakışıyor)"
page_too_small = "taramada bulunan sayfa, artı işaretlerini bulmaya yetmeyecek kadar küçük"
too_few_dots = "sayfada öğrenmeye yetecek kadar bilinen nokta yok"
page_size = "{width} x {height} piksellik sayfa, {paper} kâğıttaki {dots} nokta düzeninin {page_width} x {page_height} piksellik sayfası değil"
page_clipped = "{width} x {height} piksellik sayfa, {paper} kâğıtta {margin} pt'den az kenar boşluğu bırakıyor ve yazıcı tarafından kırpılırdı"
strip_needs_layout = "bir etiket şeridi için sayfasının düzeni gerekir"
strip_too_large = "{width} x {height} boyutundaki etiket şeridi, {dots} nokta düzeninin etiket alanına sığmıyor"
no_pages = "yazılacak sayfa yok"

[err.invalid_format]
version = "geçersiz sayfa biçimi: version 0 olmalı"
fec_order = "geçersiz sayfa biçimi: fec_order 1 ile 5 arasında olmalı"
xcrosses = "geçersiz sayfa biçimi: xcrosses >= 2 olmalı"
ycrosses = "geçersiz sayfa biçimi: ycrosses >= 2 olmalı"
chalf = "geçersiz sayfa biçimi: chalf >= 1 olmalı"
cpitch = "geçersiz sayfa biçimi: cpitch, 2*chalf değerinden büyük olmalı"
