# optar'ın Türkçe kataloğu. Anahtarlar, sıra ve yorumlar en.toml ile aynıdır; terimler docs/superpowers/glossaries/tr.md sözlüğündendir.

[language]
name = "Türkçe"

[format]
group = "."
decimal = ","

[cli]
ACTUAL_SIZE = "Gerçek boyutunda (%100) yazdırın, “Sayfaya sığdır” ile değil."
PAPER_HINT = "--paper değerinin çıktıyla aynı olduğunu ve sayfanın dik (döndürülmeden) tarandığını kontrol edin."
description = "Dosyaları kâğıt üzerinde saklar."
after_encoding = "{actual_size} {dpi} dpi çözünürlükle tarayın."
or_two = "{first} veya {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "{path} yazıldı"
format_does_not_fit = "{format} biçimi {paper} kâğıda sığmıyor"
cannot_open = "{path} açılamıyor"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "--compatible, {options} ile birlikte kullanılamaz"
format_conflict = "--format, {options} ile birlikte kullanılamaz"
slow_reader = "optar: {name}: normal okuma yöntemi bu taramanın verilerini okuyamadı; yaklaşık bir dakika süren yavaş okuma yöntemi deneniyor"
debug_images_unavailable = "optar: --debug-images, kendini tanıtan sayfalarda kullanılamaz"
force_no_effect = "optar: --force, 0.2.0 ve önceki sürümlerin çıktılarında etkisizdir"
gap = "optar: {missing} dosyası eksik, ama {existing} dosyası var"
page_stats = "sayfa {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force kurtarılabilen kısmı kaydeder, ama bu kısım hasarlı olabilir."
dot_need = "{name} {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
other = "{path} yazıldı ({count} sayfa)"

[cli.dot_name]
standard = "Standart"
medium = "Orta"
big = "Büyük"
large = "İri"
xlarge = "Çok iri"

[cli.protection]
nothing = "Koruma düzeyi {level}: hiçbir şey onarılmaz; bir sayfa kaybolur ya da hasar görürse dosyanın bir kısmı kaybolur."
within = "Koruma düzeyi {level}: sayfa içindeki hasarlar onarılır, ama kaybolan bir sayfa telafi edilemez."

[cli.protection.lose]
other = "Koruma düzeyi {level}: {total} sayfadan {count} sayfa kaybolsa da dosya kurtarılabilir."

[cli.scan]
missing = "optar: {name}: {reason}; eksik sayfa olarak sayıldı."
page = "{name}: sayfa {page}/{total}{note}"
page_again_better = "{name}: yine sayfa {page}/{total}{note}; daha iyi tarama kullanılıyor"
page_again_earlier = "{name}: yine sayfa {page}/{total}{note}; önceki tarama kullanılıyor"
note_slow = " (yavaş yöntemle okundu)"

[cli.probe]
unread = "okunamadı ({detail})"
unidentified = "tanınamadı ({detail})"
coarse = "tanınamadı ({detail}); yaklaşık {dpi} dpi ile taranmış; nokta boyutlarına göre gereken çözünürlük: {needs}"
coarse_tried = "tanınamadı ({detail}); yaklaşık {dpi} dpi ile taranmış (yavaş yöntem de denendi); nokta boyutlarına göre gereken çözünürlük: {needs}"

[cli.scan.note_unreadable]
other = ", {count} bayt okunamadı"

[cli.scan.ignored]
other = "optar: başka bir belgeye ait {count} tarama yok sayıldı: {names}"

[cli.summary]
too_many_missing = "dosyayı onarmak için çok fazla sayfa eksik"
worst = "en kötü kod sözcüğünde kullanılan: {used}/{budget}"
none_missing = "eksik sayfa yok"
separator = "; "
line = "optar: {summary}"

[cli.summary.repaired]
other = "{count} bayt onarıldı"

[cli.summary.blocks_failed]
other = "{count} blok onarılamadı"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "eksik sayfa: {list}"
several = "eksik sayfalar: {list}"

[cli.too_few.read]
other = "optar: dosya onarılamadı ve kaydedilmedi: {count} sayfadan yalnızca {read} sayfa okundu."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "{list}. sayfayı tarayın ve kod çözmeyi yineleyin; --force, her {fraction} sayfadan en az biri okunmadıkça hiçbir şey kaydetmez."
several = "Sayfaları ({list}) tarayın ve kod çözmeyi yineleyin; --force, her {fraction} sayfadan en az biri okunmadıkça hiçbir şey kaydetmez."

[cli.verified]
other = "optar: dosya doğrulandı ({count} bayt)"

[cli.force_saved]
unrepaired = "optar: dosya onarılamadı: doğrulamadan geçmedi ve hasarlı olabilir. --force nedeniyle yine de kaydedildi."
mismatch = "optar: dosya parmak iziyle eşleşmiyor: doğrulamadan geçmedi ve hasarlı olabilir. --force nedeniyle yine de kaydedildi."

[cli.not_saved]
unrepaired = "optar: dosya onarılamadı ve kaydedilmedi. {advice}"
mismatch = "optar: dosya parmak iziyle eşleşmiyor ve kaydedilmedi. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "{list}. sayfayı yeniden tarayın ve kod çözmeyi yineleyin; {force}"
several = "Sayfaları ({list}) yeniden tarayın ve kod çözmeyi yineleyin; {force}"

[cli.list_more]
other = "({count} sayfa daha)"

[cli.stat_symbols]
other = "{count} sembol"

[cli.stat_corrected]
other = "düzeltilen: {count}"

[cli.stat_uncorrectable]
other = "düzeltilemeyen: {count}"

[cli.uncorrectable_codewords]
other = "optar: {count} kod sözcüğü düzeltilemiyor. {hint}"

[cli.argparse]
usage = "kullanım: "
positionals = "konumsal argümanlar"
options = "seçenekler"
error = "{prog}: hata: {message}"
help = "bu yardım iletisini gösterip çık"
version = "programın sürüm numarasını gösterip çık"

[cli.help]
paper = "kâğıt boyutu (varsayılan: a4)"
format = "sayfa biçimini elle belirle"
encode = "bir dosyayı yazdırılabilir sayfalara kodla"
input = "kodlanacak dosya"
output = "çıktı dosyalarının temel adı (varsayılan: optar_out)"
to = "çıktı türü: tek bir PDF (varsayılan) ya da PNG veya PGM sayfa dosyaları"
label = "her sayfaya yazdırılan metin (varsayılan: -o ile verilen dosya adı)"
no_tag = "sayfa etiketlerine boyut, parmak izi ve denetim değeri içeren künyeyi ekleme"
dots = "nokta boyutu (varsayılan: standard). Boyut 'standard' dışında olursa kendini tanıtan sayfalar üretilir; --protect başka bir düzey belirtmedikçe bunlar 'standard' düzeyde korunur"
protect = "tüm belgeye yayılan onarım verisi; kendini tanıtan sayfalar üretir, --dots başka bir boyut belirtmedikçe 'standard' noktalarla. Korumasız kendini tanıtan sayfalar için 'none' kullanın. --dots ve --protect olmadan sayfalar uyumlu ve korumasız olur"
compatible = "optar 0.2 ile C aracının okuyabildiği sayfalar (--dots ve --protect verilmezse varsayılan)"
decode = "taranmış sayfaların kodunu çözüp dosyaya geri dönüştür"
base = "taramalar: BASE_0001.png, BASE_0002.png, ..."
decode_output = "çıktı dosyası (varsayılan: stdout)"
debug_images = "BASE_NNNN_debug.png dosyalarını yaz"
force = "kendini tanıtan sayfalardan kurtarılanı, doğrulamadan geçmese bile kaydet"
no_slow_reader = "normal yöntemin tanıyamadığı taramalarda yavaş okuma yöntemini deneme"

# Library errors (optar.errors): each entry is the English text of the error,
