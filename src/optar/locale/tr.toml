# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Kâğıttan oku"
ADD_SCANS = "+ Tarama ekle…"
REMOVE_SCAN = "Kaldır"
SAVE_FILE = "Dosyayı kaydet…"
ADD_SCANS_TITLE = "Tarama ekle"
SAVE_TITLE = "Kurtarılan dosyayı kaydet"
CONFIRM_SAVE_TITLE = "Yine de kaydedilsin mi?"
ERROR_TITLE = "Kaydedilemedi"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "Bu dosyaya ait değil"
NOT_READABLE = "Okunamıyor"
BEING_READ_SECTION = "Okunuyor"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Taramayı değiştir…"
USE_SPARE = "Bu taramayı kullan"
SWITCH_DOCUMENT = "Bu belgeye geç"
ASSIGN_PAGE = "Sayfaya ata…"
START_BY_HAND = "Belgeyi elle oluştur…"
REPLACE_REJECTED_TITLE = "Tarama kullanılmadı"
ASSIGN_TITLE = "Sayfaya ata"
PAGE_FIELD = "Sayfa:"
START_BY_HAND_TITLE = "Belgeyi elle oluştur"
START_BY_HAND_PROMPT = "Hiçbir tarama tanınamadı. Çıktının kâğıt boyutunu ve sayfa sayısını girin, ardından her taramayı kendi sayfasına atayın."
TOTAL_FIELD = "Sayfa sayısı:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Dosya hâlâ yazılıyor"
STILL_WRITING = "Bir dosya hâlâ yazılıyor. Bitene kadar beklensin mi? Şimdi kapatırsanız dosya yazılmamış olabilir."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "kaydetme zaten sürüyor"
SAVE_AFTER_CLOSE = "pencere kapatıldı, bu yüzden artık hiçbir şey kaydedilemez"
# The "Put on paper" tab.
WRITE_TAB = "Kâğıda yaz"
FILE_FIELD = "Dosya:"
PAPER_FIELD = "Kâğıt:"
NAME_FIELD = "Ad:"
PRINTS_AS_FIELD = "Yazdırılacak ad:"
DOTS_FIELD = "Nokta boyutu:"
PROTECT_FIELD = "Koruma:"
CHOOSE_FILE = "Seç…"
CHOOSE_FILE_TITLE = "Kâğıda yazılacak dosyayı seç"
CREATE_PDF = "PDF oluştur…"
CREATE_TITLE = "PDF'yi kaydet"
PDF_FILTER = "PDF (*.pdf);;Tüm dosyalar (*)"
PREPARING = "Dosya okunuyor…"
CREATING = "PDF oluşturuluyor…"
COMPATIBLE = "optar 0.2 ve özgün optar ile uyumlu"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "PDF, kâğıda yazılan dosyanın üzerine yazılırdı; başka bir ad seçin"
# After the pages and size of a protected file that may lose no whole page.
DAMAGE_REPAIRED = "sayfa içindeki hasar onarılır, ama bütün bir sayfa kaybolursa dosya da kaybolur"
# What a document without a name is called.
NO_NAME = "(adsız)"
# A document whose file was recovered and matches its fingerprint.
VERIFIED = "Dosya kurtarıldı ve doğrulandı"
# The bottom bar while scans are being read and the document has nothing else to say.
WORKING = "İşleniyor…"
# The bar while a document is repaired and checked in the background.
REPAIRING = "Onarılıyor ve parmak iziyle karşılaştırılıyor…"
# Why a page whose data says it repairs itself gave no data to repair with.
NO_PAGE_DATA = "Bu sayfanın verileri okunamadı"
PREVIEW_LOADING = "Yükleniyor…"
# A scan the ordinary reader could not read, while the slower reader tries it.
READING_COARSE = "Düşük çözünürlüklü tarama yavaş yöntemle okunuyor; bu yaklaşık bir dakika sürer"
# After "too coarse to read": the slower reader could not read the scan either.
SLOW_TRIED = "Düşük çözünürlüklü taramalar için yavaş yöntem de denendi, ama o da taramayı okuyamadı."
# A page read by the slower reader: in its detail (made a sentence by "sentence"
# below), and in its row.
READ_SLOWLY = "Düşük çözünürlüklü taramalar için yavaş yöntemle okundu"
READ_SLOWLY_ROW = "Yavaş yöntemle okundu"
# The step of a scan not started yet.
WAITING = "Sırada"
# The choice of language.
LANGUAGE_MENU = "Dil"
SYSTEM_LANGUAGE = "Sistem varsayılanı"
# A phrase made a sentence, where the window shows it as a line of its own after
# others (a detail panel, a reason after "was not used"): {words} with the full
# stop of your language. A phrase that already ends with it is shown as it is.
sentence = "{words}."

