upper_right = "sağ üst köşe bulunamıyor"
lower_left = "sol alt köşe bulunamıyor"
lower_right = "sağ alt köşe bulunamıyor"

[count.page]
other = "{n} sayfa"

[count.byte]
other = "{n} bayt"

[count.block]
