checking = "Aún se está comprobando la huella, así que todavía no se sabe si el archivo recuperado es el original."
empty = "No hay nada que guardar."
mismatch = "El archivo recuperado no coincide con la huella impresa en el papel: algunos datos se decodificaron mal, así que no es el archivo original."
by_hand = "Este documento se compuso a mano, así que el archivo no se puede verificar y se rellenará con ceros hasta completar una página entera."
untagged = "Estas páginas no llevan etiqueta, así que el archivo no se puede verificar y se rellenará con ceros hasta completar una página entera."

# After the runs a save warning names: the pages it does not name.
[gui.save.more]
