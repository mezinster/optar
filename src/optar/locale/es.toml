# Catálogo en español de optar. Claves, orden y comentarios como en en.toml; términos según docs/superpowers/glossaries/es.md.

[language]
name = "Español"

[format]
group = "."
decimal = ","

[cli]
ACTUAL_SIZE = "Imprima a tamaño real (100 %), no con «Ajustar a la página»."
PAPER_HINT = "Compruebe que --paper coincide con la impresión y que la página se escaneó derecha, sin girar."
description = "Guardar archivos en papel."
after_encoding = "{actual_size} Escanee a {dpi} dpi."
or_two = "{first} o {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "se escribió {path}"
format_does_not_fit = "el formato {format} no cabe en papel {paper}"
cannot_open = "no se puede abrir {path}"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "--compatible no se puede usar con {options}"
format_conflict = "--format no se puede usar con {options}"
slow_reader = "optar: {name}: el lector normal no pudo leer los datos de este escaneo; se prueba el lector lento, que tarda alrededor de un minuto"
debug_images_unavailable = "optar: --debug-images no está disponible para páginas autoidentificables"
force_no_effect = "optar: --force no tiene efecto en impresiones de la versión 0.2.0 o anterior"
gap = "optar: falta {missing}, pero existe {existing}"
page_stats = "página {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force guarda lo que se recuperó, que puede estar dañado."
dot_need = "{name} {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
one = "se escribió {path} ({count} página)"
other = "se escribió {path} ({count} páginas)"

[cli.dot_name]
standard = "Estándar"
medium = "Mediano"
big = "Grande"
large = "Muy grande"
xlarge = "Extragrande"

[cli.protection]
nothing = "Nivel de protección {level}: no se repara nada; una página perdida o dañada hace perder parte del archivo."
within = "Nivel de protección {level}: repara los daños dentro de las páginas; no puede compensar una página perdida."

[cli.protection.lose]
one = "Nivel de protección {level}: se puede perder {count} página de {total} y aun así recuperar el archivo."
other = "Nivel de protección {level}: se pueden perder {count} páginas de {total} y aun así recuperar el archivo."

[cli.scan]
missing = "optar: {name}: {reason}; se cuenta como página ausente."
page = "{name}: página {page} de {total}{note}"
page_again_better = "{name}: otra vez la página {page} de {total}{note}; se usa el mejor escaneo"
page_again_earlier = "{name}: otra vez la página {page} de {total}{note}; se usa el escaneo anterior"
note_slow = " (leída por el lector lento)"

[cli.probe]
unread = "no se pudo leer ({detail})"
unidentified = "no identificado ({detail})"
coarse = "no identificado ({detail}); se escaneó a unos {dpi} dpi y los tamaños de punto necesitan: {needs}"
coarse_tried = "no identificado ({detail}); se escaneó a unos {dpi} dpi (también se probó el lector lento) y los tamaños de punto necesitan: {needs}"

[cli.scan.note_unreadable]
one = ", {count} byte ilegible"
other = ", {count} bytes ilegibles"

[cli.scan.ignored]
one = "optar: se ignoró {count} escaneo de otro documento: {names}"
other = "optar: se ignoraron {count} escaneos de otro documento: {names}"

[cli.summary]
too_many_missing = "faltan demasiadas páginas para reparar el archivo"
worst = "la peor palabra de código usó {used} de {budget}"
none_missing = "no falta ninguna página"
separator = "; "
line = "optar: {summary}"

[cli.summary.repaired]
one = "se reparó {count} byte"
other = "se repararon {count} bytes"

[cli.summary.blocks_failed]
one = "no se pudo reparar {count} bloque"
other = "no se pudieron reparar {count} bloques"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "falta la página {list}"
several = "faltan las páginas {list}"

[cli.too_few.read]
one = "optar: no se pudo reparar el archivo y no se ha guardado: solo se ha leído {read} de {count} página."
other = "optar: no se pudo reparar el archivo y no se ha guardado: solo se han leído {read} de {count} páginas."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "Escanee la página {list} y vuelva a decodificar; --force no guarda nada si se ha leído menos de una página de cada {fraction}."
several = "Escanee las páginas {list} y vuelva a decodificar; --force no guarda nada si se ha leído menos de una página de cada {fraction}."

[cli.verified]
one = "optar: archivo verificado ({count} byte)"
other = "optar: archivo verificado ({count} bytes)"

[cli.force_saved]
unrepaired = "optar: no se pudo reparar el archivo: no superó la verificación y puede estar dañado. Se guardó de todos modos por --force."
mismatch = "optar: el archivo no coincide con su huella: no superó la verificación y puede estar dañado. Se guardó de todos modos por --force."

[cli.not_saved]
unrepaired = "optar: no se pudo reparar el archivo y no se ha guardado. {advice}"
mismatch = "optar: el archivo no coincide con su huella y no se ha guardado. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "Vuelva a escanear la página {list} y a decodificar; {force}"
several = "Vuelva a escanear las páginas {list} y a decodificar; {force}"

[cli.list_more]
one = "({count} más)"
other = "({count} más)"

[cli.stat_symbols]
one = "{count} símbolo"
other = "{count} símbolos"

[cli.stat_corrected]
one = "{count} corregido"
other = "{count} corregidos"

[cli.stat_uncorrectable]
one = "{count} no corregible"
other = "{count} no corregibles"

[cli.uncorrectable_codewords]
one = "optar: {count} palabra de código no corregible. {hint}"
other = "optar: {count} palabras de código no corregibles. {hint}"

[cli.argparse]
usage = "uso: "
positionals = "argumentos posicionales"
options = "opciones"
error = "{prog}: error: {message}"
help = "mostrar este mensaje de ayuda y salir"
version = "mostrar la versión del programa y salir"

[cli.help]
paper = "tamaño del papel (predeterminado: a4)"
format = "imponer otro formato de página"
encode = "codificar un archivo en páginas para imprimir"
input = "archivo que se codifica"
output = "nombre base de salida (predeterminado: optar_out)"
to = "tipo de salida: un PDF (predeterminado) o archivos de página PNG o PGM"
label = "texto impreso en cada página (predeterminado: el nombre de archivo dado con -o)"
no_tag = "no añadir a los rótulos de las páginas la etiqueta con el tamaño, la huella y el control"
dots = "tamaño de punto (predeterminado: standard). Cualquier tamaño que no sea standard crea páginas autoidentificables, con protección de nivel standard salvo que --protect indique otra cosa"
protect = "datos de reparación repartidos por todo el documento; crea páginas autoidentificables, con puntos standard salvo que --dots indique otra cosa. Use 'none' para páginas autoidentificables sin protección. Sin --dots ni --protect, las páginas son compatibles y no tienen protección"
compatible = "páginas que leen optar 0.2 y la herramienta en C (lo predeterminado sin --dots ni --protect)"
decode = "decodificar páginas escaneadas y obtener de nuevo el archivo"
base = "los escaneos son BASE_0001.png, BASE_0002.png, ..."
decode_output = "archivo de salida (predeterminado: stdout)"
debug_images = "escribir BASE_NNNN_debug.png"
force = "guardar lo que se recuperó de las páginas autoidentificables aunque no haya superado la verificación"
no_slow_reader = "no probar el lector lento con los escaneos que el lector normal no puede identificar"

# Library errors (optar.errors): each entry is the English text of the error,
# word for word; a test compares them with the code.
[err]
cannot_read = "no se puede leer {path}: {reason}"
cannot_write = "no se puede escribir {path}: {reason}"
unknown_paper = "papel desconocido: {name}; conocidos: {known}"
unknown_dots = "tamaño de punto desconocido: {name}; conocidos: {known}"
format_syntax = "el formato de página debe constar de ocho enteros separados por guiones: {text}"
label_band = "la banda del rótulo debe tener {rows} filas, no {height}"
label_font = "no se puede leer una banda de rótulo de {height} filas; la fuente tiene {rows}"
too_many_pages = "demasiadas páginas: se necesitan {total}, como máximo {limit}"
too_large_to_protect = "demasiado grande para protegerlo: {size} B en papel, como máximo {limit}"
unknown_parity = "la paridad debe ser una de {known}, no {parity}"
format_too_small = "el formato de página {format} es demasiado pequeño para el contenedor"
format_cannot_end = "el formato de página {format} no puede terminar un flujo en una página"
impossible_document = "las páginas describen un documento que no puede existir: {total} pág. para un archivo de {size} B"
image_too_large = "no se puede leer la imagen {path}: {pixels} píxeles son más de los {limit} que puede tener un escaneo"
image_size_changed = "no se puede leer la imagen {path}: el tamaño de la imagen cambió durante la carga"
not_an_image = "no se puede leer la imagen {path}: no es una imagen {formats}"
image_unreadable = "no se puede leer la imagen {path}: {reason}"
no_page = "no se encontró ninguna página"
label_unreadable = "rótulo ilegible"
scan_not_grey = "el escaneo debe ser una imagen en gris uint8 de 2 dimensiones; se recibió shape {shape}, dtype {dtype}"
scan_empty = "el escaneo está vacío"
scan_too_small = "un escaneo de {width} x {height} píxeles es más pequeño que los {page_width} x {page_height} del formato de página"
corners_coincide = "las esquinas de la página son degeneradas (coinciden)"
page_too_small = "la página encontrada en el escaneo es demasiado pequeña para localizar sus cruces"
too_few_dots = "hay muy pocos puntos conocidos en la página para aprender de ellos"
page_size = "una página de {width} x {height} píxeles no es la página de {page_width} x {page_height} píxeles del diseño de puntos {dots} en papel {paper}"
page_clipped = "una página de {width} x {height} píxeles deja menos de {margin} pt de margen en papel {paper} y la impresora la recortaría"
strip_needs_layout = "una tira de rótulo necesita el diseño de su página"
strip_too_large = "una tira de rótulo de {width} x {height} no cabe en la banda del rótulo del diseño de puntos {dots}"
no_pages = "no hay páginas que escribir"

[err.invalid_format]
version = "formato de página no válido: version debe ser 0"
fec_order = "formato de página no válido: fec_order debe estar entre 1 y 5"
xcrosses = "formato de página no válido: xcrosses debe ser >= 2"
ycrosses = "formato de página no válido: ycrosses debe ser >= 2"
chalf = "formato de página no válido: chalf debe ser >= 1"
cpitch = "formato de página no válido: cpitch debe ser mayor que 2*chalf"
border = "formato de página no válido: border debe ser >= 1"
text_height = "formato de página no válido: text_height debe ser >= 1"

[err.no_corner]
upper_left = "no se encuentra la esquina superior izquierda"
upper_right = "no se encuentra la esquina superior derecha"
lower_left = "no se encuentra la esquina inferior izquierda"
lower_right = "no se encuentra la esquina inferior derecha"

# A list of names of which one is meant, inside an error message (the image
# formats of err.not_an_image): the earlier names joined by separator, the last
# one added by last ("PNG, TIFF, BMP, PGM/PPM or JPEG").
[alternatives]
separator = ", "
last = "{items} o {last}"

[count.page]
one = "{n} página"
other = "{n} páginas"

[count.byte]
one = "{n} byte"
other = "{n} bytes"

[count.block]
one = "{n} bloque"
other = "{n} bloques"

[count.dot]
one = "{n} punto"
other = "{n} puntos"

[count.scan]
one = "{n} escaneo"
other = "{n} escaneos"

# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Leer del papel"
ADD_SCANS = "+ Añadir escaneos…"
REMOVE_SCAN = "Quitar"
SAVE_FILE = "Guardar archivo…"
ADD_SCANS_TITLE = "Añadir escaneos"
SAVE_TITLE = "Guardar el archivo recuperado"
CONFIRM_SAVE_TITLE = "¿Guardar de todos modos?"
ERROR_TITLE = "No se pudo guardar"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "No pertenecen a este archivo"
NOT_READABLE = "Ilegibles"
BEING_READ_SECTION = "En lectura"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Reemplazar escaneo…"
USE_SPARE = "Usar este escaneo"
SWITCH_DOCUMENT = "Cambiar a este documento"
ASSIGN_PAGE = "Asignar a página…"
START_BY_HAND = "Componer documento a mano…"
REPLACE_REJECTED_TITLE = "Escaneo no usado"
ASSIGN_TITLE = "Asignar a una página"
PAGE_FIELD = "Página:"
START_BY_HAND_TITLE = "Componer un documento a mano"
START_BY_HAND_PROMPT = "No se pudo identificar ningún escaneo. Indique el papel y el número de páginas de la impresión y, después, asigne cada escaneo a su página."
TOTAL_FIELD = "Páginas:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Aún se está escribiendo un archivo"
STILL_WRITING = "Aún se está escribiendo un archivo. ¿Esperar a que termine? Si cierra ahora, puede que no llegue a escribirse."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "ya hay un guardado en curso"
SAVE_AFTER_CLOSE = "la ventana se ha cerrado, así que ya no se puede guardar nada"
# The "Put on paper" tab.
WRITE_TAB = "Pasar al papel"
FILE_FIELD = "Archivo:"
PAPER_FIELD = "Papel:"
NAME_FIELD = "Nombre:"
PRINTS_AS_FIELD = "Se imprime como:"
DOTS_FIELD = "Tamaño de punto:"
PROTECT_FIELD = "Protección:"
CHOOSE_FILE = "Elegir…"
CHOOSE_FILE_TITLE = "Elegir un archivo para pasar al papel"
CREATE_PDF = "Crear PDF…"
CREATE_TITLE = "Guardar el PDF"
PDF_FILTER = "PDF (*.pdf);;Todos los archivos (*)"
PREPARING = "Leyendo el archivo…"
CREATING = "Creando el PDF…"
COMPATIBLE = "Compatible con optar 0.2 y el optar original"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "el PDF reemplazaría el archivo que se está pasando al papel; elija otro nombre"
# After the pages and size of a protected file that may lose no whole page.
DAMAGE_REPAIRED = "los daños dentro de las páginas se reparan, pero si se pierde una página entera se pierde el archivo"
# What a document without a name is called.
NO_NAME = "(sin nombre)"
# A document whose file was recovered and matches its fingerprint.
VERIFIED = "Archivo recuperado y verificado"
# The bottom bar while scans are being read and the document has nothing else to say.
WORKING = "Procesando…"
# The bar while a document is repaired and checked in the background.
REPAIRING = "Reparando y comprobando la huella…"
# Why a page whose data says it repairs itself gave no data to repair with.
NO_PAGE_DATA = "No se pudieron leer los datos de esta página"
PREVIEW_LOADING = "Cargando…"
# A scan the ordinary reader could not read, while the slower reader tries it.
READING_COARSE = "Leyendo un escaneo de baja resolución con el lector lento; esto lleva alrededor de un minuto"
# After "too coarse to read": the slower reader could not read the scan either.
SLOW_TRIED = "También se probó el lector lento para escaneos de baja resolución, y tampoco pudo leerlo."
# A page read by the slower reader: in its detail (made a sentence by "sentence"
# below), and in its row.
READ_SLOWLY = "Leída por el lector lento para escaneos de baja resolución"
READ_SLOWLY_ROW = "Leída por el lector lento"
# The step of a scan not started yet.
WAITING = "En espera"
# The choice of language.
LANGUAGE_MENU = "Idioma"
SYSTEM_LANGUAGE = "Idioma del sistema"
# A phrase made a sentence, where the window shows it as a line of its own after
# others (a detail panel, a reason after "was not used"): {words} with the full
# stop of your language. A phrase that already ends with it is shown as it is.
sentence = "{words}."

# The terminal messages of optar-gui.
[gui.cli]
missing_qt = "optar-gui necesita PySide6: ejecute pip install '.[gui]' en una copia del código fuente, o descargue optar-gui de la página Releases del proyecto."
description = "Guardar archivos en papel y volver a leerlos."
version_help = "mostrar la versión y salir"

[gui.button]
ok = "Aceptar"
cancel = "Cancelar"
save = "Guardar"
yes = "Sí"
no = "No"

