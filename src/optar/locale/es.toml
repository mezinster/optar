xlarge = "{paper}, puntos extragrandes"

[gui.protection]
none = "Ninguna"
standard = "Estándar"
high = "Alta"

# The health of a page, in its row.
[gui.health]
good = "Correcta"
unreadable = "Ilegible"
missing = "Ausente"
waiting = "En espera"
working = "Procesando…"

# {n} blocks repaired.
[gui.health.repaired]
one = "Reparada · {n}"
other = "Reparada · {n}"

# {n} blocks lost, which the document's protection repaired.
[gui.health.restored]
one = "Reparada por la protección del documento · {n}"
other = "Reparada por la protección del documento · {n}"

# {n} blocks lost.
[gui.health.damaged]
