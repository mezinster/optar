[gui.state]
checking = "Comprobando la huella…"
matches = "coincide con la huella"
mismatch = "No coincide con la huella del papel"
no_tag = "no se puede verificar (sin etiqueta)"
# {advice}: rescan advice (whole sentences); {repair}: what the repair did.
advice_with_repair = "{advice} ({repair})"
# {good}: the "good" phrase below; {repaired}: the "repaired" phrase below.
