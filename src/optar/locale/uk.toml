# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Зчитати з паперу"
ADD_SCANS = "+ Додати скани…"
REMOVE_SCAN = "Прибрати"
SAVE_FILE = "Зберегти файл…"
ADD_SCANS_TITLE = "Додати скани"
SAVE_TITLE = "Зберегти відновлений файл"
CONFIRM_SAVE_TITLE = "Усе одно зберегти?"
ERROR_TITLE = "Не вдалося зберегти"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "Не належать до цього файлу"
NOT_READABLE = "Не зчитуються"
BEING_READ_SECTION = "Зчитуються"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Замінити скан…"
USE_SPARE = "Взяти цей скан"
SWITCH_DOCUMENT = "Перейти до цього документа"
ASSIGN_PAGE = "Вказати сторінку…"
START_BY_HAND = "Зібрати документ вручну…"
REPLACE_REJECTED_TITLE = "Скан не використано"
ASSIGN_TITLE = "Вказати сторінку"
PAGE_FIELD = "Сторінка:"
START_BY_HAND_TITLE = "Зібрати документ вручну"
START_BY_HAND_PROMPT = "Жоден скан не вдалося розпізнати. Вкажіть папір і кількість сторінок роздруківки, а потім — сторінку для кожного скану."
TOTAL_FIELD = "Сторінок:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Файл ще записується"
STILL_WRITING = "Файл ще записується. Зачекати, доки запис завершиться? Якщо закрити вікно зараз, файл може залишитися незаписаним."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "збереження вже триває"
SAVE_AFTER_CLOSE = "вікно закрито, тож більше нічого зберегти не можна"
# The "Put on paper" tab.
WRITE_TAB = "Записати на папір"
FILE_FIELD = "Файл:"
PAPER_FIELD = "Папір:"
NAME_FIELD = "Назва:"
PRINTS_AS_FIELD = "Друкується як:"
DOTS_FIELD = "Розмір точок:"
PROTECT_FIELD = "Захист:"
CHOOSE_FILE = "Вибрати…"
CHOOSE_FILE_TITLE = "Вибрати файл для запису на папір"
CREATE_PDF = "Створити PDF…"
CREATE_TITLE = "Зберегти PDF"
PDF_FILTER = "PDF (*.pdf);;Усі файли (*)"
PREPARING = "Зчитування файлу…"
CREATING = "Створення PDF…"
COMPATIBLE = "Сумісність з optar 0.2 і оригінальним optar"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "PDF замінив би файл, який записується на папір; виберіть інше ім’я"
