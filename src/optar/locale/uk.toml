# Український каталог optar. Ключі, порядок і коментарі — як в en.toml (коментарі
# залишено англійською: вони для перекладачів і супровідників). Терміни — за
# глосарієм docs/superpowers/glossaries/uk.md.

[language]
name = "Українська"

[format]
group = " "
decimal = ","

[cli]
ACTUAL_SIZE = "Друкуйте у фактичному розмірі (100%), а не «За розміром сторінки»."
PAPER_HINT = "Переконайтеся, що --paper відповідає роздруківці й що сторінку відскановано в прямому положенні (не повернуто)."
description = "Зберігання файлів на папері."
after_encoding = "{actual_size} Скануйте з роздільною здатністю {dpi} dpi."
or_two = "{first} або {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "записано файл {path}"
format_does_not_fit = "формат {format} не вміщується на папір {paper}"
cannot_open = "не вдається відкрити {path}"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "--compatible не можна використовувати разом з {options}"
format_conflict = "--format не можна використовувати разом з {options}"
slow_reader = "optar: {name}: звичайний метод зчитування не зміг зчитати дані цього скану; запускається повільний метод, це займе близько хвилини"
debug_images_unavailable = "optar: параметр --debug-images недоступний для сторінок із самоідентифікацією"
force_no_effect = "optar: параметр --force не діє на роздруківки версії 0.2.0 і раніших версій"
gap = "optar: немає файлу {missing}, хоча файл {existing} є"
page_stats = "сторінка {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force зберігає те, що вдалося відновити, але воно може бути пошкоджене."
dot_need = "{name} — {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
one = "записано файл {path} ({count} сторінка)"
few = "записано файл {path} ({count} сторінки)"
many = "записано файл {path} ({count} сторінок)"

[cli.dot_name]
standard = "стандартні"
medium = "середні"
big = "великі"
large = "крупні"
xlarge = "дуже крупні"

[cli.protection]
nothing = "Рівень захисту {level}: нічого не виправляється; якщо сторінку втрачено або пошкоджено, втрачається частина файлу."
within = "Рівень захисту {level}: пошкодження всередині сторінок виправляються, але втрачену сторінку відновити не можна."

[cli.protection.lose]
one = "Рівень захисту {level}: можна втратити {count} сторінку з {total} і все одно відновити файл."
few = "Рівень захисту {level}: можна втратити {count} сторінки з {total} і все одно відновити файл."
many = "Рівень захисту {level}: можна втратити {count} сторінок з {total} і все одно відновити файл."

[cli.scan]
missing = "optar: {name}: {reason}; сторінку враховано як відсутню."
page = "{name}: сторінка {page} з {total}{note}"
page_again_better = "{name}: знову сторінка {page} з {total}{note}; використано кращий скан"
page_again_earlier = "{name}: знову сторінка {page} з {total}{note}; використано раніший скан"
note_slow = " (зчитано повільним методом)"

[cli.probe]
unread = "не вдалося зчитати ({detail})"
unidentified = "скан не розпізнано ({detail})"
coarse = "скан не розпізнано ({detail}); його роздільна здатність — приблизно {dpi} dpi, а для розмірів точок потрібно: {needs}"
coarse_tried = "скан не розпізнано ({detail}); його роздільна здатність — приблизно {dpi} dpi (повільний метод теж випробувано), а для розмірів точок потрібно: {needs}"

[cli.scan.note_unreadable]
one = ", {count} байт не зчитується"
few = ", {count} байти не зчитуються"
many = ", {count} байтів не зчитуються"

[cli.scan.ignored]
one = "optar: пропущено {count} скан іншого документа: {names}"
few = "optar: пропущено {count} скани іншого документа: {names}"
many = "optar: пропущено {count} сканів іншого документа: {names}"

[cli.summary]
too_many_missing = "забагато відсутніх сторінок, щоб відновити файл"
worst = "у найгіршому кодовому слові використано {used} з {budget}"
none_missing = "відсутніх сторінок немає"
separator = "; "
line = "optar: {summary}"

[cli.summary.repaired]
one = "виправлено {count} байт"
few = "виправлено {count} байти"
many = "виправлено {count} байтів"

[cli.summary.blocks_failed]
one = "{count} блок не вдалося виправити"
few = "{count} блоки не вдалося виправити"
many = "{count} блоків не вдалося виправити"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "немає сторінки {list}"
several = "немає сторінок {list}"

[cli.too_few.read]
one = "optar: файл не вдалося виправити, і його не збережено: зчитано лише {read} з {count} сторінки."
few = "optar: файл не вдалося виправити, і його не збережено: зчитано лише {read} з {count} сторінок."
many = "optar: файл не вдалося виправити, і його не збережено: зчитано лише {read} з {count} сторінок."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "Відскануйте сторінку {list} і декодуйте знову; --force нічого не зберігає, якщо зчитано менше ніж одну сторінку з кожних {fraction}."
several = "Відскануйте сторінки {list} і декодуйте знову; --force нічого не зберігає, якщо зчитано менше ніж одну сторінку з кожних {fraction}."

[cli.verified]
one = "optar: файл перевірено ({count} байт)"
few = "optar: файл перевірено ({count} байти)"
many = "optar: файл перевірено ({count} байтів)"

[cli.force_saved]
unrepaired = "optar: файл не вдалося виправити: він не пройшов перевірки й може бути пошкоджений. Усе одно збережено через --force."
mismatch = "optar: файл не збігається зі своїм відбитком: він не пройшов перевірки й може бути пошкоджений. Усе одно збережено через --force."

[cli.not_saved]
unrepaired = "optar: файл не вдалося виправити, і його не збережено. {advice}"
mismatch = "optar: файл не збігається зі своїм відбитком, і його не збережено. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "Повторно відскануйте сторінку {list} і декодуйте знову; {force}"
several = "Повторно відскануйте сторінки {list} і декодуйте знову; {force}"

[cli.list_more]
one = "(ще {count})"
few = "(ще {count})"
many = "(ще {count})"

[cli.stat_symbols]
one = "{count} символ"
few = "{count} символи"
many = "{count} символів"

[cli.stat_corrected]
one = "скориговано: {count}"
few = "скориговано: {count}"
many = "скориговано: {count}"

[cli.stat_uncorrectable]
one = "невиправних: {count}"
few = "невиправних: {count}"
many = "невиправних: {count}"

[cli.uncorrectable_codewords]
one = "optar: {count} невиправне кодове слово. {hint}"
few = "optar: {count} невиправні кодові слова. {hint}"
many = "optar: {count} невиправних кодових слів. {hint}"

