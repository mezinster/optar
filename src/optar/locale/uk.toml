advice = "Файл не вдалося виправити повністю. Результат ще можна покращити, якщо додати або повторно відсканувати сторінки: {what}."
both = "{add} і {rescan}"

# {pages}: single when it names exactly one page, several when more.
[gui.rescan.add]
single = "додайте сторінку {pages}"
several = "додайте сторінки {pages}"

# {pages}: at most three pages, the most damaged first; single or several as above.
[gui.rescan.worst]
single = "повторно відскануйте сторінку {pages} — на ній найбільше пошкоджень"
several = "повторно відскануйте сторінки {pages} — на них найбільше пошкоджень"
