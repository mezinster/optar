DAMAGE_REPAIRED = "пошкодження всередині сторінок виправляються, але якщо втратити цілу сторінку, файл буде втрачено"
# What a document without a name is called.
NO_NAME = "(без назви)"
# A document whose file was recovered and matches its fingerprint.
