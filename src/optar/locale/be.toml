# The bar while scans are being read and the document has nothing else to say.
[gui.scans_read_working]
one = "Апрацоўка… Прачытана сканаў: {done} з {n}"
few = "Апрацоўка… Прачытана сканаў: {done} з {n}"
many = "Апрацоўка… Прачытана сканаў: {done} з {n}"

# Lists of page numbers: "1, 3 and 5", "2-4 and 9".
[gui.list]
comma = ", "
and = "{items} і {last}"
# Three or more pages in a row, from {first} to {last}: your language's range mark.
range = "{first}–{last}"

# The pages a list does not name.
[gui.list.more]
one = "яшчэ {n}"
few = "яшчэ {n}"
many = "яшчэ {n}"

# What repairing a document did.
[gui.repair]
unprotected = "Дакумент надрукаваны без абароны, таму нічога нельга было выправіць"
too_much = "у найгоршым месцы спатрэбілася {used} з {budget}: занадта шмат для выпраўлення"

[gui.repair.bytes]
one = "выпраўлены {n} байт"
few = "выпраўлены {n} байты"
many = "выпраўлена {n} байтаў"

# How close a repair came to failing: {percent}% of the repair capacity ({used}
# of {budget}) used at the worst spot.
[gui.margin]
wide = "у найгоршым месцы выкарыстана {percent}% рэсурсу выпраўлення ({used} з {budget}): вялікі запас"
moderate = "у найгоршым месцы выкарыстана {percent}% рэсурсу выпраўлення ({used} з {budget}): умераны запас"
close = "у найгоршым месцы выкарыстана {percent}% рэсурсу выпраўлення ({used} з {budget}): на мяжы"

# After a repair that could not give the file.
[gui.rescan]
nothing = "Файл не ўдалося выправіць цалкам. Калі адсканаваць старонкі нанова, вынік яшчэ можа палепшыцца."
# {what}: "add" and "rescan" below, or both.
advice = "Файл не ўдалося выправіць цалкам. Вынік яшчэ можна палепшыць, калі дадаць старонкі або адсканаваць іх нанова: {what}."
both = "{add} і {rescan}"

# {pages}: single when it names exactly one page, several when more.
[gui.rescan.add]
single = "дадайце старонку {pages}"
several = "дадайце старонкі {pages}"

# {pages}: at most three pages, the most damaged first; single or several as above.
[gui.rescan.worst]
single = "адскануйце нанова старонку {pages} — на ёй найбольш пашкоджанняў"
several = "адскануйце нанова старонкі {pages} — на іх найбольш пашкоджанняў"
