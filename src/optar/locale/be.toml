# Беларускі каталог optar. Ключы, парадак і каментарыі — як у en.toml (каментарыі на англійскай: яны для перакладчыкаў); тэрміны — паводле docs/superpowers/glossaries/be.md.

[language]
name = "Беларуская"

[format]
group = " "
decimal = ","

[cli]
ACTUAL_SIZE = "Друкуйце ў натуральную велічыню (100%), а не «Па памеры старонкі»."
PAPER_HINT = "Пераканайцеся, што --paper адпавядае раздрукоўцы і што старонка адсканавана ў прамым становішчы (не павернута)."
description = "Захоўванне файлаў на паперы."
after_encoding = "{actual_size} Скануйце з раздзяляльнасцю {dpi} dpi."
or_two = "{first} або {second}"
list_separator = ", "
sentences = "{first} {second}"
wrote = "запісаны файл {path}"
format_does_not_fit = "фармат {format} не змяшчаецца на паперы {paper}"
cannot_open = "не ўдаецца адкрыць {path}"
line = "optar: {message}"
line_hint = "optar: {message}. {hint}"
os_error = "optar: {reason}"
os_error_file = "optar: {file}: {reason}"
compatible_conflict = "--compatible нельга выкарыстоўваць разам з {options}"
format_conflict = "--format нельга выкарыстоўваць разам з {options}"
slow_reader = "optar: {name}: звычайны метад чытання не змог прачытаць даныя гэтага скана; запускаецца павольны метад, гэта зойме каля хвіліны"
debug_images_unavailable = "optar: параметр --debug-images недаступны для самаапазнавальных старонак"
force_no_effect = "optar: параметр --force не дзейнічае на раздрукоўкі версіі 0.2.0 і больш ранніх"
gap = "optar: няма файла {missing}, хоць файл {existing} ёсць"
page_stats = "старонка {number}: {symbols}, {corrected}, {uncorrectable}"
force_advice = "--force захоўвае тое, што ўдалося аднавіць, але яно можа быць пашкоджана."
dot_need = "{name} — {dpi}"
in_scan = "{name}: {message}"

[cli.wrote_pdf]
one = "запісаны файл {path} ({count} старонка)"
few = "запісаны файл {path} ({count} старонкі)"
many = "запісаны файл {path} ({count} старонак)"

[cli.dot_name]
standard = "стандартныя"
medium = "сярэднія"
big = "вялікія"
large = "буйныя"
xlarge = "вельмі буйныя"

[cli.protection]
nothing = "Узровень абароны {level}: нічога не выпраўляецца; калі старонка страчана або пашкоджана, губляецца частка файла."
within = "Узровень абароны {level}: пашкоджанні ўнутры старонак выпраўляюцца, але страчаную старонку аднавіць нельга."

[cli.protection.lose]
one = "Узровень абароны {level}: можна страціць {count} старонку з {total} і ўсё роўна аднавіць файл."
few = "Узровень абароны {level}: можна страціць {count} старонкі з {total} і ўсё роўна аднавіць файл."
many = "Узровень абароны {level}: можна страціць {count} старонак з {total} і ўсё роўна аднавіць файл."

[cli.scan]
missing = "optar: {name}: {reason}; старонка лічыцца адсутнай."
page = "{name}: старонка {page} з {total}{note}"
page_again_better = "{name}: зноў старонка {page} з {total}{note}; выкарыстоўваецца лепшы скан"
page_again_earlier = "{name}: зноў старонка {page} з {total}{note}; выкарыстоўваецца больш ранні скан"
note_slow = " (прачытана павольным метадам)"

[cli.probe]
unread = "не ўдалося прачытаць ({detail})"
unidentified = "скан не апазнаны ({detail})"
coarse = "скан не апазнаны ({detail}); яго раздзяляльнасць — каля {dpi} dpi, а для памераў кропак патрэбна: {needs}"
