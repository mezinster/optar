# --- The desktop window (src/optar_gui/text.py) ------------------------------------
#
# The window speaks of "protection", "repair" and the "fingerprint", never of parity,
# codewords or headers. A "block" is one error-correction unit; blocks are "repaired"
# or "lost". {pages} is a list of page numbers ("3", "2-4, 7 and 9"). An entry that
# has it comes in two forms, chosen by whether the list names exactly one page
# (single) or more (several); this is not a plural rule, so the "one" form of your
# language (which may also serve 21, 31 and so on) plays no part in it.

[gui]
# The window, its tabs, buttons and dialogs.
WINDOW_TITLE = "optar"
READ_TAB = "Прачытаць з паперы"
ADD_SCANS = "+ Дадаць сканы…"
REMOVE_SCAN = "Прыбраць"
SAVE_FILE = "Захаваць файл…"
ADD_SCANS_TITLE = "Дадаць сканы"
SAVE_TITLE = "Захаваць адноўлены файл"
CONFIRM_SAVE_TITLE = "Усё роўна захаваць?"
ERROR_TITLE = "Не ўдалося захаваць"
# Titles of the sections of the list of scans.
NOT_PART_OF_THIS_FILE = "Не належаць да гэтага файла"
NOT_READABLE = "Не чытаюцца"
BEING_READ_SECTION = "Чытаюцца"
# The actions on the selected row and their dialogs.
REPLACE_SCAN = "Замяніць скан…"
USE_SPARE = "Узяць гэты скан"
SWITCH_DOCUMENT = "Перайсці да гэтага дакумента"
ASSIGN_PAGE = "Указаць старонку…"
START_BY_HAND = "Сабраць дакумент уручную…"
REPLACE_REJECTED_TITLE = "Скан не выкарыстаны"
ASSIGN_TITLE = "Указаць старонку"
PAGE_FIELD = "Старонка:"
START_BY_HAND_TITLE = "Сабраць дакумент уручную"
START_BY_HAND_PROMPT = "Ніводны скан не ўдалося апазнаць. Укажыце паперу і колькасць старонак раздрукоўкі, а потым — старонку для кожнага скана."
TOTAL_FIELD = "Старонак:"
# Asked when the window is closed while a file is being written.
STILL_WRITING_TITLE = "Файл яшчэ запісваецца"
STILL_WRITING = "Файл яшчэ запісваецца. Пачакаць, пакуль запіс скончыцца? Калі закрыць акно зараз, файл можа застацца незапісаным."
# Why a save cannot start (programming errors, never shown in a dialog).
SAVE_RUNNING = "захаванне ўжо ідзе"
SAVE_AFTER_CLOSE = "акно закрыта, таму больш нічога захаваць нельга"
# The "Put on paper" tab.
WRITE_TAB = "Запісаць на паперу"
FILE_FIELD = "Файл:"
PAPER_FIELD = "Папера:"
NAME_FIELD = "Назва:"
PRINTS_AS_FIELD = "Друкуецца як:"
DOTS_FIELD = "Памер кропак:"
PROTECT_FIELD = "Абарона:"
CHOOSE_FILE = "Выбраць…"
CHOOSE_FILE_TITLE = "Выбраць файл для запісу на паперу"
CREATE_PDF = "Стварыць PDF…"
CREATE_TITLE = "Захаваць PDF"
PDF_FILTER = "PDF (*.pdf);;Усе файлы (*)"
PREPARING = "Чытанне файла…"
CREATING = "Стварэнне PDF…"
COMPATIBLE = "Сумяшчальнасць з optar 0.2 і першапачатковай праграмай optar"
# Why a PDF is not created over the file being put on paper.
DEST_IS_SOURCE = "PDF замяніў бы файл, які запісваецца на паперу; выберыце іншую назву"
