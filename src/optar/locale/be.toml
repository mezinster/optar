few = "{count} блокі не ўдалося выправіць"
many = "{count} блокаў не ўдалося выправіць"

# {list} is a list of page numbers ("3", "2, 5, 7"). The two forms are chosen by
# whether the list names exactly one page (single) or more (several), not by a
# plural rule: in some languages the "one" form also serves 21, 31 and so on.
[cli.summary.missing]
single = "няма старонкі {list}"
several = "няма старонак {list}"

[cli.too_few.read]
one = "optar: файл не ўдалося выправіць, і ён не захаваны: прачытана толькі {read} з {count} старонкі."
few = "optar: файл не ўдалося выправіць, і ён не захаваны: прачытана толькі {read} з {count} старонак."
many = "optar: файл не ўдалося выправіць, і ён не захаваны: прачытана толькі {read} з {count} старонак."

# {list}: the missing pages; single when it names exactly one page, several when more.
# {fraction}: a number (2: "one page in 2").
[cli.too_few.rescan]
single = "Адскануйце старонку {list} і паўтарыце раскадаванне; --force нічога не захоўвае, калі прачытана менш за адну старонку з кожных {fraction}."
several = "Адскануйце старонкі {list} і паўтарыце раскадаванне; --force нічога не захоўвае, калі прачытана менш за адну старонку з кожных {fraction}."

[cli.verified]
one = "optar: файл правераны ({count} байт)"
few = "optar: файл правераны ({count} байты)"
many = "optar: файл правераны ({count} байтаў)"

[cli.force_saved]
unrepaired = "optar: файл не ўдалося выправіць: ён не прайшоў праверку і можа быць пашкоджаны. Усё роўна захаваны праз --force."
mismatch = "optar: файл не супадае са сваім адбіткам: ён не прайшоў праверку і можа быць пашкоджаны. Усё роўна захаваны праз --force."

[cli.not_saved]
unrepaired = "optar: файл не ўдалося выправіць, і ён не захаваны. {advice}"
mismatch = "optar: файл не супадае са сваім адбіткам і не захаваны. {advice}"

# {list}: pages to rescan; single when it names exactly one page, several when more.
# {force}: the sentence cli.force_advice.
[cli.rescan_advice]
single = "Адскануйце нанова старонку {list} і паўтарыце раскадаванне; {force}"
several = "Адскануйце нанова старонкі {list} і паўтарыце раскадаванне; {force}"

[cli.list_more]
one = "(яшчэ {count})"
few = "(яшчэ {count})"
many = "(яшчэ {count})"

[cli.stat_symbols]
